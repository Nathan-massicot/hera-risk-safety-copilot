<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <style>
      .root-box { fill: #B3D4FC; stroke: #6A9FD8; stroke-width: 1.5; rx: 6; }
      .pillar-box { fill: #F28B82; stroke: #D65D5D; stroke-width: 1.5; rx: 6; }
      .dim-box { fill: #81C995; stroke: #4CAF50; stroke-width: 1.2; rx: 5; }
      .root-text { font-size: 14px; font-weight: bold; fill: #1a1a1a; }
      .pillar-text { font-size: 12px; font-weight: bold; fill: #1a1a1a; }
      .dim-text { font-size: 11px; fill: #1a1a1a; }
      .line { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">HERA Taxonomy — Health Ethical &amp; Regulatory Assessment</text>
  <text x="550" y="55" text-anchor="middle" font-size="12" fill="#666">for mHealth Applications (AI and non-AI)</text>

  <!-- ROOT NODE -->
  <rect class="root-box" x="30" y="75" width="260" height="40"/>
  <text class="root-text" x="160" y="100" text-anchor="middle">HERA Framework</text>

  <!-- ========== PILLAR 1: Patient Safety ========== -->
  <path class="line" d="M160,115 L160,155 L200,155" />
  <rect class="pillar-box" x="205" y="140" width="220" height="35"/>
  <text class="pillar-text" x="315" y="162" text-anchor="middle">Patient Safety &amp;</text>
  <text class="pillar-text" x="315" y="174" text-anchor="middle" font-size="11">Clinical Risk</text>

  <!-- P1 dimensions -->
  <path class="line" d="M425,157 L500,105"/>
  <rect class="dim-box" x="505" y="80" width="260" height="26"/>
  <text class="dim-text" x="635" y="97" text-anchor="middle">Clinical Evidence &amp; Validation</text>

  <path class="line" d="M425,157 L500,130"/>
  <rect class="dim-box" x="505" y="115" width="260" height="26"/>
  <text class="dim-text" x="635" y="132" text-anchor="middle">Contraindications &amp; Adverse Effects</text>

  <path class="line" d="M425,157 L500,155"/>
  <rect class="dim-box" x="505" y="145" width="260" height="26"/>
  <text class="dim-text" x="635" y="162" text-anchor="middle">False Sense of Security</text>

  <path class="line" d="M425,157 L500,180"/>
  <rect class="dim-box" x="505" y="175" width="260" height="26"/>
  <text class="dim-text" x="635" y="192" text-anchor="middle">Delayed Medical Consultation</text>

  <path class="line" d="M425,157 L500,210"/>
  <rect class="dim-box" x="505" y="205" width="260" height="26"/>
  <text class="dim-text" x="635" y="222" text-anchor="middle">Measurement Reliability</text>

  <path class="line" d="M425,157 L500,240"/>
  <rect class="dim-box" x="505" y="235" width="260" height="26"/>
  <text class="dim-text" x="635" y="252" text-anchor="middle">System Dependency &amp; Over-reliance</text>

  <!-- ========== PILLAR 2: Data Ethics & Privacy ========== -->
  <path class="line" d="M160,115 L160,340 L200,340"/>
  <rect class="pillar-box" x="205" y="322" width="220" height="35"/>
  <text class="pillar-text" x="315" y="344" text-anchor="middle">Data Ethics &amp; Privacy</text>

  <path class="line" d="M425,340 L500,290"/>
  <rect class="dim-box" x="505" y="280" width="260" height="26"/>
  <text class="dim-text" x="635" y="297" text-anchor="middle">Informed Consent</text>

  <path class="line" d="M425,340 L500,315"/>
  <rect class="dim-box" x="505" y="310" width="260" height="26"/>
  <text class="dim-text" x="635" y="327" text-anchor="middle">Data Minimization</text>

  <path class="line" d="M425,340 L500,340"/>
  <rect class="dim-box" x="505" y="340" width="260" height="26"/>
  <text class="dim-text" x="635" y="357" text-anchor="middle">Storage, Encryption &amp; Security</text>

  <path class="line" d="M425,340 L500,370"/>
  <rect class="dim-box" x="505" y="370" width="260" height="26"/>
  <text class="dim-text" x="635" y="387" text-anchor="middle">Third-Party Data Sharing</text>

  <path class="line" d="M425,340 L500,400"/>
  <rect class="dim-box" x="505" y="400" width="260" height="26"/>
  <text class="dim-text" x="635" y="417" text-anchor="middle">Anonymization &amp; Right to Erasure</text>

  <path class="line" d="M425,340 L500,430"/>
  <rect class="dim-box" x="505" y="430" width="260" height="26"/>
  <text class="dim-text" x="635" y="447" text-anchor="middle">Vulnerable Population Data</text>

  <!-- ========== PILLAR 3: Patient Autonomy ========== -->
  <path class="line" d="M160,115 L160,530 L200,530"/>
  <rect class="pillar-box" x="205" y="512" width="220" height="35"/>
  <text class="pillar-text" x="315" y="534" text-anchor="middle">Patient Autonomy &amp;</text>
  <text class="pillar-text" x="315" y="546" text-anchor="middle" font-size="11">Therapeutic Relationship</text>

  <path class="line" d="M425,530 L500,485"/>
  <rect class="dim-box" x="505" y="475" width="290" height="26"/>
  <text class="dim-text" x="650" y="492" text-anchor="middle">Right to Make Decisions</text>

  <path class="line" d="M425,530 L500,515"/>
  <rect class="dim-box" x="505" y="505" width="290" height="26"/>
  <text class="dim-text" x="650" y="522" text-anchor="middle">Emotional Manipulation &amp; Excessive Nudging</text>

  <path class="line" d="M425,530 L500,545"/>
  <rect class="dim-box" x="505" y="535" width="290" height="26"/>
  <text class="dim-text" x="650" y="552" text-anchor="middle">Impact on Doctor-Patient Relationship</text>

  <path class="line" d="M425,530 L500,575"/>
  <rect class="dim-box" x="505" y="565" width="290" height="26"/>
  <text class="dim-text" x="650" y="582" text-anchor="middle">Dynamic Consent &amp; Withdrawal Rights</text>

  <path class="line" d="M425,530 L500,605"/>
  <rect class="dim-box" x="505" y="595" width="290" height="26"/>
  <text class="dim-text" x="650" y="612" text-anchor="middle">Automation Bias (AI and Non-AI)</text>

  <!-- ========== PILLAR 4: Quality, Usability & Reliability ========== -->
  <path class="line" d="M160,115 L160,700 L200,700"/>
  <rect class="pillar-box" x="205" y="682" width="220" height="35"/>
  <text class="pillar-text" x="315" y="704" text-anchor="middle">Quality, Usability &amp;</text>
  <text class="pillar-text" x="315" y="716" text-anchor="middle" font-size="11">Technical Reliability</text>

  <path class="line" d="M425,700 L500,650"/>
  <rect class="dim-box" x="505" y="640" width="290" height="26"/>
  <text class="dim-text" x="650" y="657" text-anchor="middle">App Stability &amp; Error Handling</text>

  <path class="line" d="M425,700 L500,680"/>
  <rect class="dim-box" x="505" y="670" width="290" height="26"/>
  <text class="dim-text" x="650" y="687" text-anchor="middle">Interoperability &amp; Data Exchange</text>

  <path class="line" d="M425,700 L500,710"/>
  <rect class="dim-box" x="505" y="700" width="290" height="26"/>
  <text class="dim-text" x="650" y="717" text-anchor="middle">Accessibility (WCAG, Literacy, Language)</text>

  <path class="line" d="M425,700 L500,740"/>
  <rect class="dim-box" x="505" y="730" width="290" height="26"/>
  <text class="dim-text" x="650" y="747" text-anchor="middle">User-Centered Design &amp; Usability Testing</text>

  <path class="line" d="M425,700 L500,770"/>
  <rect class="dim-box" x="505" y="760" width="290" height="26"/>
  <text class="dim-text" x="650" y="777" text-anchor="middle">Offline Functionality &amp; Updates</text>

  <!-- ========== PILLAR 5: Transparency & Explainability ========== -->
  <path class="line" d="M160,115 L160,870 L200,870"/>
  <rect class="pillar-box" x="205" y="852" width="220" height="35"/>
  <text class="pillar-text" x="315" y="874" text-anchor="middle">Transparency &amp;</text>
  <text class="pillar-text" x="315" y="886" text-anchor="middle" font-size="11">Explainability</text>

  <path class="line" d="M425,870 L500,825"/>
  <rect class="dim-box" x="505" y="815" width="320" height="26"/>
  <text class="dim-text" x="665" y="832" text-anchor="middle">Understandable Output (How results are produced)</text>

  <path class="line" d="M425,870 L500,855"/>
  <rect class="dim-box" x="505" y="845" width="320" height="26"/>
  <text class="dim-text" x="665" y="862" text-anchor="middle">Clear Communication of Limitations</text>

  <path class="line" d="M425,870 L500,885"/>
  <rect class="dim-box" x="505" y="875" width="320" height="26"/>
  <text class="dim-text" x="665" y="892" text-anchor="middle">Decision Traceability &amp; Logging</text>

  <path class="line" d="M425,870 L500,915"/>
  <rect class="dim-box" x="505" y="905" width="320" height="26"/>
  <text class="dim-text" x="665" y="922" text-anchor="middle">Distinction: Clinically Validated vs. Estimated Content</text>

  <!-- ========== PILLAR 6: Equity, Bias & Social Justice ========== -->
  <path class="line" d="M160,115 L160,1030 L200,1030"/>
  <rect class="pillar-box" x="205" y="1012" width="220" height="35"/>
  <text class="pillar-text" x="315" y="1034" text-anchor="middle">Equity, Bias &amp;</text>
  <text class="pillar-text" x="315" y="1046" text-anchor="middle" font-size="11">Social Justice</text>

  <path class="line" d="M425,1030 L500,985"/>
  <rect class="dim-box" x="505" y="975" width="320" height="26"/>
  <text class="dim-text" x="665" y="992" text-anchor="middle">Data &amp; Clinical Rule Bias</text>

  <path class="line" d="M425,1030 L500,1015"/>
  <rect class="dim-box" x="505" y="1005" width="320" height="26"/>
  <text class="dim-text" x="665" y="1022" text-anchor="middle">Digital Divide &amp; Socioeconomic Access</text>

  <path class="line" d="M425,1030 L500,1045"/>
  <rect class="dim-box" x="505" y="1035" width="320" height="26"/>
  <text class="dim-text" x="665" y="1052" text-anchor="middle">Cross-Cultural &amp; Multilingual Validation</text>

  <path class="line" d="M425,1030 L500,1075"/>
  <rect class="dim-box" x="505" y="1065" width="320" height="26"/>
  <text class="dim-text" x="665" y="1082" text-anchor="middle">Impact on Existing Health Inequalities</text>

  <path class="line" d="M425,1030 L500,1105"/>
  <rect class="dim-box" x="505" y="1095" width="320" height="26"/>
  <text class="dim-text" x="665" y="1112" text-anchor="middle">Representativeness in Validation Studies</text>

  <!-- ========== PILLAR 7: Regulatory Compliance & Governance ========== -->
  <path class="line" d="M160,115 L160,1210 L200,1210"/>
  <rect class="pillar-box" x="205" y="1192" width="220" height="35"/>
  <text class="pillar-text" x="315" y="1214" text-anchor="middle">Regulatory Compliance</text>
  <text class="pillar-text" x="315" y="1226" text-anchor="middle" font-size="11">&amp; Governance</text>

  <path class="line" d="M425,1210 L500,1145"/>
  <rect class="dim-box" x="505" y="1135" width="320" height="26"/>
  <text class="dim-text" x="665" y="1152" text-anchor="middle">Medical Device Classification (SaMD)</text>

  <path class="line" d="M425,1210 L500,1175"/>
  <rect class="dim-box" x="505" y="1165" width="320" height="26"/>
  <text class="dim-text" x="665" y="1182" text-anchor="middle">CE Marking &amp; MDR Conformity</text>

  <path class="line" d="M425,1210 L500,1205"/>
  <rect class="dim-box" x="505" y="1195" width="320" height="26"/>
  <text class="dim-text" x="665" y="1212" text-anchor="middle">EU AI Act Risk Classification (if AI)</text>

  <path class="line" d="M425,1210 L500,1235"/>
  <rect class="dim-box" x="505" y="1225" width="320" height="26"/>
  <text class="dim-text" x="665" y="1242" text-anchor="middle">GDPR Compliance (DPO, DPIA)</text>

  <path class="line" d="M425,1210 L500,1265"/>
  <rect class="dim-box" x="505" y="1255" width="320" height="26"/>
  <text class="dim-text" x="665" y="1272" text-anchor="middle">Post-Market Surveillance &amp; Vigilance</text>

  <path class="line" d="M425,1210 L500,1295"/>
  <rect class="dim-box" x="505" y="1285" width="320" height="26"/>
  <text class="dim-text" x="665" y="1302" text-anchor="middle">Third-Party Audit &amp; Certification</text>

  <path class="line" d="M425,1210 L500,1325"/>
  <rect class="dim-box" x="505" y="1315" width="320" height="26"/>
  <text class="dim-text" x="665" y="1332" text-anchor="middle">AI Lifecycle &amp; Documentation Management</text>

  <!-- Legend -->
  <rect x="40" y="1420" width="18" height="14" rx="3" fill="#B3D4FC" stroke="#6A9FD8"/>
  <text x="65" y="1432" font-size="11" fill="#333">Root</text>
  <rect x="120" y="1420" width="18" height="14" rx="3" fill="#F28B82" stroke="#D65D5D"/>
  <text x="145" y="1432" font-size="11" fill="#333">Pillar (7)</text>
  <rect x="220" y="1420" width="18" height="14" rx="3" fill="#81C995" stroke="#4CAF50"/>
  <text x="245" y="1432" font-size="11" fill="#333">Dimension (37)</text>

  <text x="550" y="1470" text-anchor="middle" font-size="10" fill="#999">Fig. 1. Proposed HERA Taxonomy for mHealth Applications</text>
  <text x="550" y="1485" text-anchor="middle" font-size="9" fill="#bbb">Sources: DTX Canvas (Denecke 2023), WHO AI Health (2024), EU AI Act, MDR 2017/745, GDPR, ISO 82304-2, NICE ESF, ODI Ethics Canvas</text>
</svg>