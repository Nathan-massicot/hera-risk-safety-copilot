[project]
name = "hera-copilot"
version = "0.1.0"
description = "Risk & Safety Copilot for mHealth app developers — HERA taxonomy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=4.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
datagen = [
    "anthropic>=0.40",
    "tqdm>=4.66",
    "jsonschema>=4.20",
]
train = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
    "trl>=0.9",
]
rag = [
    "chromadb>=0.4",
    "sentence-transformers>=2.7",
    "pypdf>=4.0",
]
eval = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "bcrypt>=4.1",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "typer>=0.12",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "ipykernel>=6.29",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[project.scripts]
hera-copilot = "src.baseline.copilot:main"
hera-web = "web.backend.app.main:run"
hera-cli = "web.backend.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
