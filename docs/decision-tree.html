alue** to give a result →\n  IVD-MDSW (typically Class C for diabetes management software).\n- A consumer **genetic-risk app** parsing DNA sequencing data for disease predisposition\n  → IVD-MDSW, commonly **Class C** (genetic testing rule).\n- **Edge/negative:** a **meal-logging coaching** app that takes no specimen data, only\n  self-reported food, is **not** IVDR — and if it merely tracks without clinical\n  interpretation it may not even be a device (see [[iso_82304]]).\n\n## HERA dimensions touched\n- **Device qualification (IVDR vs MDR)** · **IVD class A-D** · **Performance evaluation** · **EU market access**\n- Cross-links: [[mdr_class_iia]] · [[mdr_class_iib]] · [[mdr_class_iii]] · [[samd_standards]] ·\n  [[clinical_eval_mdsw]] · [[pms_lifecycle]] · [[udi_eudamed]] · [[iso_82304]]\n\n## Official sources\n- IVDR (Regulation (EU) 2017/746) — Art. 2(2), Annex VIII: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32017R0746\n- MDCG 2020-16 rev.4 (Mar 2025) — IVDR classification rules: https://health.ec.europa.eu/document/download/12f9756a-1e0d-4aed-9783-d948553f1705_en?filename=md_mdcg_2020_guidance_classification_ivd-md_en.pdf\n- MDCG 2019-11 rev.1 (June 2025) — software qualification & classification: https://health.ec.europa.eu/latest-updates/update-mdcg-2019-11-rev1-qualification-and-classification-software-regulation-eu-2017745-and-2025-06-17_en\n", "mdr_class_i": "# SaMD Class I (MDR)\n\n## Why this concerns you (purpose)\nYour software has a **medical purpose** and qualifies as Software as a Medical Device\n(SaMD), but it sits at the **lowest risk class** under MDR Rule 11. Class I is the only\nSaMD class you can in principle **self-certify** — no Notified Body audits your file\nbefore you sell. That is a real advantage, but it is also the **most fragile position**:\nRule 11 is written so that *almost everything that drives a clinical decision lands in\nIIa or above*. Most apps that think they are Class I are actually [[mdr_class_iia]]. Use\nthis card to confirm you genuinely fall in Class I and to size the (still real) obligations.\n\n## When it is triggered (scope)\nTriggered when **all** of the following hold:\n- the software provides information for a medical purpose (it is SaMD, not wellness —\n  if not, fall back to [[iso_82304]]);\n- under **Rule 11 (Annex VIII)** the information it provides is **not** used to take\n  decisions with diagnosis or therapeutic purposes, and it does **not** monitor vital\n  physiological processes/parameters;\n- per **MDCG 2019-11**, it falls in the **Rule 11(c) residual bucket** (\"all other MDSW\"),\n  which defaults to **Class I** — e.g. simple data display, storage, communication, or\n  archiving without clinical interpretation.\n\nIf it influences diagnosis/therapy → [[mdr_class_iia]] or higher. If it analyses a\nspecimen → [[ivdr_class]] instead.\n\n## Concrete obligations\n- **Self-declaration of conformity** (Art. 52(7)): you draw up the EU Declaration of\n  Conformity and affix the CE mark **without** a Notified Body — *except* if the device\n  is Class I with a measuring function, sterile, or reusable surgical (rare for SaMD).\n- Build the **technical documentation** (Annexes II & III) and keep it current.\n- Apply the **General Safety & Performance Requirements** (Annex I) using the\n  [[samd_standards]] (IEC 62304, ISO 14971, IEC 62366-1; a QMS per ISO 13485).\n- Run a **clinical evaluation** proportionate to the low class ([[clinical_eval_mdsw]]).\n- Register as an actor and the device → UDI + EUDAMED ([[udi_eudamed]]).\n- Operate **post-market surveillance** and vigilance ([[pms_lifecycle]]).\n\n## Checklist\n- [ ] Re-run the Rule 11 / MDCG 2019-11 test: confirm you are truly Rule 11(c), not 11(a)/11(b).\n- [ ] Confirm no measuring/sterile/reusable-surgical trigger (else a Notified Body is needed).\n- [ ] Assemble the technical file (Annex II/III) before placing on the market.\n- [ ] Register actor (SRN) + device in EUDAMED and assign UDI.\n- [ ] Set up a PMS plan even at Class I (it is not optional).\n\n## Examples (mHealth)\n- A medication-reminder app that **only stores and displays** a clinician-set schedule,\n  with no dosing logic → Rule 11(c), Class I.\n- A secure messaging/archiving app moving clinical data between HCPs **without\n  interpreting** it → Class I.\n- **Edge/negative:** an app that flags \"your glucose trend looks dangerous, see a doctor\"\n  *interprets* data to drive a decision → this is **not** Class I; Rule 11(a) pushes it\n  to at least [[mdr_class_iia]] (or higher if serious harm is possible).\n\n## HERA dimensions touched\n- **Device qualification & class** · **Self-certification route** · **EU market access**\n- Cross-links: [[mdr_class_iia]] · [[mdr_class_iib]] · [[mdr_class_iii]] · [[ivdr_class]] ·\n  [[samd_standards]] · [[clinical_eval_mdsw]] · [[pms_lifecycle]] · [[udi_eudamed]] · [[iso_82304]]\n\n## Official sources\n- MDR (consolidated 2017/745) — Annex VIII Rule 11, Art. 52(7): https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02017R0745-20230320\n- MDCG 2019-11 rev.1 (June 2025) — qualification & classification of MDSW: https://health.ec.europa.eu/latest-updates/update-mdcg-2019-11-rev1-qualification-and-classification-software-regulation-eu-2017745-and-2025-06-17_en\n", "mdr_class_iia": "# SaMD Class IIa (MDR)\n\n## Why this concerns you (purpose)\nClass IIa is the **default landing zone for most clinical mHealth software**. Under\nMDR Rule 11, *any* software that provides information used to take **diagnostic or\ntherapeutic decisions** is Class IIa unless the potential harm pushes it higher. The\npractical leap from [[mdr_class_i]] is that you can **no longer self-certify**: a\n**Notified Body** must assess your quality system (and a sample of your technical\ndocumentation) before you may CE-mark. This card is the one to read carefully — most\nteams that assumed \"Class I\" actually sit here.\n\n## When it is triggered (scope)\nTriggered when, under **Rule 11 / MDCG 2019-11**:\n- the software provides information **used to take decisions with diagnosis or\n  therapeutic purposes** (Rule 11(a)) and the worst plausible consequence of an error\n  is **moderate** (not serious harm, not death/irreversible deterioration); **or**\n- the software is intended to **monitor physiological processes/parameters** that are\n  **not** vital (Rule 11(b) baseline).\n\nIf a wrong output could cause **serious harm** → [[mdr_class_iib]]; if **death or\nirreversible deterioration** → [[mdr_class_iii]]. If it merely displays/stores data →\n[[mdr_class_i]]. If it analyses a specimen → [[ivdr_class]].\n\n## Concrete obligations\n- **Notified Body conformity assessment** (Art. 52): typically **Annex IX** (QMS +\n  assessment of technical documentation on a *representative sample basis*). The NB\n  audits your premises and issues the certificate.\n- **ISO 13485 quality management system** must be operational and audited (part of\n  [[samd_standards]]; ISO 13485 & ISO 14971 are harmonised under MDR).\n- Full **General Safety & Performance Requirements** (Annex I) evidenced via IEC 62304\n  (lifecycle), ISO 14971 (risk), IEC 62366-1 (usability).\n- **Clinical evaluation** demonstrating scientific validity, technical performance and\n  clinical benefit — the 3-pillar MDCG 2020-1 model ([[clinical_eval_mdsw]]).\n- **Proactive PMS** with a PMS plan and **Periodic Safety Update Report (PSUR)**, plus\n  vigilance reporting ([[pms_lifecycle]]).\n- UDI assignment + EUDAMED registration ([[udi_eudamed]]).\n\n## Checklist\n- [ ] Engage a designated Notified Body early (capacity is a bottleneck).\n- [ ] Stand up an ISO 13485 QMS and the Annex II/III technical file.\n- [ ] Produce a Rule 11 classification rationale that justifies IIa over IIb.\n- [ ] Build the clinical evaluation report (3 pillars) under [[clinical_eval_mdsw]].\n- [ ] Plan the PSUR cadence and PMCF as part of [[pms_lifecycle]].\n\n## Examples (mHealth)\n- A symptom-checker that **suggests a likely condition / triage level** to inform a\n  non-urgent care decision → Rule 11(a), moderate consequence → Class IIa.\n- An app computing an **insulin-dose suggestion** from logged values where an error\n  has only moderate, correctable impact → IIa (escalates to IIb if serious harm is\n  plausible — see [[mdr_class_iib]]).\n- **Edge/negative:** an app monitoring a **vital** parameter (e.g. continuous cardiac\n  rhythm with alarms) is **not** IIa — Rule 11(b) places vital-sign monitoring with\n  immediate-danger potential at **IIb** ([[mdr_class_iib]]) or higher.\n\n## HERA dimensions touched\n- **Device qualification & class** · **Notified Body route** · **Clinical evidence** · **EU market access**\n- Cross-links: [[mdr_class_i]] · [[mdr_class_iib]] · [[mdr_class_iii]] · [[ivdr_class]] ·\n  [[samd_standards]] · [[clinical_eval_mdsw]] · [[pms_lifecycle]] · [[udi_eudamed]]\n\n## Official sources\n- MDR (consolidated 2017/745) — Annex VIII Rule 11, Art. 52: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02017R0745-20230320\n- MDCG 2019-11 rev.1 (June 2025) — qualification & classification of MDSW: https://health.ec.europa.eu/latest-updates/update-mdcg-2019-11-rev1-qualification-and-classification-software-regulation-eu-2017745-and-2025-06-17_en\n", "mdr_class_iib": "# SaMD Class IIb (MDR)\n\n## Why this concerns you (purpose)\nClass IIb is for software whose erroneous output could cause **serious harm to health**.\nCompared with [[mdr_class_iia]], the regime intensifies in two ways: the **clinical\nevidence bar rises** and the **Notified Body looks at your technical documentation more\ndeeply and more often** (not just a representative sample). This is the class where\nclinical and regulatory effort starts to dominate the project budget, so getting the\nRule 11 reasoning right — IIa vs IIb vs [[mdr_class_iii]] — is decisive.\n\n## When it is triggered (scope)\nTriggered when, under **Rule 11 / MDCG 2019-11**:\n- the software provides information used for **diagnostic or therapeutic decisions** and\n  an error could cause a **serious deterioration of health** or require **surgical\n  intervention** (Rule 11(a) → IIb); **or**\n- the software is intended to **monitor vital physiological parameters** where a\n  variation could result in **immediate danger** (Rule 11(b) → IIb).\n\nA worse outcome (death / irreversible deterioration) → [[mdr_class_iii]]; only moderate\nconsequence → [[mdr_class_iia]]. Specimen analysis → [[ivdr_class]].\n\n## Concrete obligations\n- **Notified Body conformity assessment** (Art. 52): Annex IX QMS audit **plus\n  assessment of technical documentation**; for IIb the NB scrutiny is broader and at\n  least one technical-documentation surveillance assessment occurs **annually** for\n  implantable IIb (and proportionately for high-risk software).\n- **In-depth clinical evaluation** with stronger clinical data; **PSUR updated at least\n  annually** and reviewed by the NB ([[clinical_eval_mdsw]], [[pms_lifecycle]]).\n- For **active IIb devices intended to administer/remove a medicinal product**, the NB\n  must obtain an **expert-panel scientific opinion** on the clinical evaluation — note\n  the overlap with drug-companion logic in [[combination_product]].\n- Full QMS + GSPR via [[samd_standards]]; UDI + EUDAMED ([[udi_eudamed]]).\n- Reinforced **post-market surveillance and PMCF** ([[pms_lifecycle]]).\n\n## Checklist\n- [ ] Document why the worst-case harm is \"serious\" (IIb) and not \"irreversible/fatal\" (III).\n- [ ] Secure NB capacity and budget for per-device technical-documentation review.\n- [ ] Strengthen the clinical evaluation; plan annual PSUR + PMCF.\n- [ ] Check whether medicinal-product administration triggers the expert-panel route.\n- [ ] Maintain ISO 13485 QMS and complete EUDAMED/UDI before market entry.\n\n## Examples (mHealth)\n- A **closed-loop dosing / titration** app where a wrong recommendation could cause\n  serious (but recoverable) deterioration → Rule 11(a) serious harm → Class IIb.\n- An app providing **alarms on a vital parameter** (e.g. apnoea/arrhythmia alerting)\n  where missing an event poses immediate danger → Rule 11(b) → IIb.\n- **Edge/negative:** the *same* closed-loop app, if a dosing error could cause **death\n  or irreversible** harm, is **not** IIb — Rule 11 escalates it to [[mdr_class_iii]],\n  triggering a clinical investigation and design-dossier examination.\n\n## HERA dimensions touched\n- **Device qualification & class** · **Deep Notified Body scrutiny** · **Strengthened clinical evidence** · **EU market access**\n- Cross-links: [[mdr_class_i]] · [[mdr_class_iia]] · [[mdr_class_iii]] · [[ivdr_class]] ·\n  [[samd_standards]] · [[clinical_eval_mdsw]] · [[pms_lifecycle]] · [[udi_eudamed]] · [[combination_product]]\n\n## Official sources\n- MDR (consolidated 2017/745) — Annex VIII Rule 11, Art. 52, Annex IX: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02017R0745-20230320\n- MDCG 2019-11 rev.1 (June 2025) — qualification & classification of MDSW: https://health.ec.europa.eu/latest-updates/update-mdcg-2019-11-rev1-qualification-and-classification-software-regulation-eu-2017745-and-2025-06-17_en\n", "mdr_class_iii": "# SaMD Class III (MDR)\n\n## Why this concerns you (purpose)\nClass III is the **strictest MDR regime**. Software lands here under Rule 11 when an\nerroneous output could cause **death or an irreversible deterioration** of a person's\nstate of health. Compared with [[mdr_class_iib]], two things change qualitatively: a\n**clinical investigation is in principle compulsory** (not just a literature-based\nevaluation), and the **Notified Body examines the full design dossier per device** with\nannual surveillance. This is rare for pure mHealth, but it is exactly where the most\naggressive AI-driven diagnostic/therapeutic apps can fall — plan for years, not months.\n\n## When it is triggered (scope)\nTriggered when, under **Rule 11(a) / MDCG 2019-11**, the software provides information\nused to take **diagnostic or therapeutic decisions** and an error **may cause death or\nan irreversible deterioration** of health. (Rule 11 routes the highest-consequence\ndecision-support software to Class III.)\n\nIf the worst case is \"serious but recoverable\" → [[mdr_class_iib]]; \"moderate\" →\n[[mdr_class_iia]]. Specimen analysis → [[ivdr_class]] (its Class D is the IVDR analogue\nof highest risk).\n\n## Concrete obligations\n- **Notified Body conformity assessment** (Art. 52(3)): **Annex IX QMS + full\n  assessment of the technical/design documentation for each device** (or Annex X\n  type-examination + Annex XI). The NB issues the certificate and conducts **annual**\n  surveillance audits.\n- **Clinical investigation** generally required (MDR Annex XV, EN ISO 14155), feeding a\n  high-evidence **clinical evaluation** ([[clinical_eval_mdsw]]).\n- **Clinical evaluation consultation procedure (CECP)**: for certain Class III devices\n  the NB must seek a **scientific opinion from an MDCG expert panel** before certifying.\n- **Annual PSUR** reviewed by the NB; intensive **PMS + PMCF** ([[pms_lifecycle]]).\n- Full QMS + GSPR via [[samd_standards]]; UDI + EUDAMED ([[udi_eudamed]]).\n\n## Checklist\n- [ ] Confirm the Rule 11 worst-case really is death/irreversible harm (vs IIb serious harm).\n- [ ] Budget and design a clinical investigation (EN ISO 14155) early.\n- [ ] Anticipate the expert-panel scrutiny (CECP) timeline in your NB plan.\n- [ ] Prepare a full design dossier for per-device NB examination.\n- [ ] Lock annual PSUR + PMCF and EUDAMED/UDI registration before market entry.\n\n## Examples (mHealth)\n- An **autonomous AI** that issues a treatment/triage decision for a life-threatening\n  condition where an error is non-recoverable → Rule 11(a) highest consequence → Class III.\n- Software **controlling a life-sustaining therapy** (e.g. an algorithm that directly\n  drives a critical infusion regimen) → Class III.\n- **Edge/negative:** a clinician **decision-support** tool that only *recommends* and is\n  always overridden by a doctor who makes the final call may be argued **down** to\n  [[mdr_class_iib]] or [[mdr_class_iia]] — the level of human control and the immediacy\n  of harm change the Rule 11 outcome.\n\n## HERA dimensions touched\n- **Device qualification & class** · **Clinical investigation** · **Full design-dossier review + annual audit** · **EU market access**\n- Cross-links: [[mdr_class_i]] · [[mdr_class_iia]] · [[mdr_class_iib]] · [[ivdr_class]] ·\n  [[samd_standards]] · [[clinical_eval_mdsw]] · [[pms_lifecycle]] · [[udi_eudamed]] · [[ai_act_high_risk]]\n\n## Official sources\n- MDR (consolidated 2017/745) — Annex VIII Rule 11, Art. 52(3), Annexes IX/X/XV: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02017R0745-20230320\n- MDCG 2019-11 rev.1 (June 2025) — qualification & classification of MDSW: https://health.ec.europa.eu/latest-updates/update-mdcg-2019-11-rev1-qualification-and-classification-software-regulation-eu-2017745-and-2025-06-17_en\n", "mdr_transition": "# MDR transition for legacy devices (Regulation (EU) 2023/607)\n\n## Why this concerns you (purpose)\nIf your SaMD already holds a certificate under the **old directive (MDD/AIMD)**,\nyou are not yet under the full MDR — but you are living on borrowed time. Regulation\n(EU) 2023/607 **extended** the MDR transition so legacy devices can stay on the\nmarket while manufacturers complete MDR certification, **provided strict conditions\nwere met by mid-2024**. Miss those conditions and your legacy certificate's cover\ncollapses; meet them and you have until 2027/2028. This card tells you which clock\nyou are on.\n\n## When it is triggered (scope)\nTriggered when:\n- your device/SaMD is a **legacy device** with a **valid MDD/AIMD certificate** (or\n  a Class I device that was self-declared under the MDD but is up-classified under\n  the MDR), and\n- you intend to **keep it on the EU market** during the transition rather than\n  certify fresh under the MDR.\n\nA **brand-new SaMD certified today** applies the MDR directly and is **out of scope**\nof this regime ([[mdr_class_iia]], [[mdr_class_iib]]).\n\n## Concrete obligations\n- **Extended deadlines** (amended MDR Art. 120):\n  - **31 December 2027** — Class III and implantable Class IIb devices;\n  - **31 December 2028** — other Class IIb, Class IIa, and Class I devices placed\n    under a notified body (e.g. up-classified or sterile/measuring Class I).\n- **Conditions to benefit** (all required): the device still complies with the\n  MDD/AIMD and has no significant changes in design/intended purpose; it presents no\n  unacceptable risk; the manufacturer had an **MDR-compliant QMS by 26 May 2024**;\n  lodged a formal MDR application; and signed a **written agreement with a notified\n  body by 26 September 2024**.\n- The **\"sell-off\" period was removed**: compliant legacy devices already on the\n  market may be made available **without a time limit**.\n- Continue MDR-style **post-market surveillance and vigilance** in the meantime\n  ([[pms_lifecycle]]).\n\n## Checklist\n- [ ] Confirm the device had an MDR-compliant QMS in place by 26 May 2024.\n- [ ] Confirm a signed notified-body agreement existed by 26 September 2024.\n- [ ] Verify no \"significant change\" has been made to design or intended purpose.\n- [ ] Map your device class to the right deadline (2027 vs 2028).\n- [ ] Run the MDR certification project to finish before that deadline.\n\n## Examples (mHealth)\n- A Class IIb radiology-triage SaMD with a valid MDD certificate and a 2024 NB\n  agreement -> may stay on the market until **31 December 2027**, then needs an MDR\n  certificate ([[mdr_class_iib]]).\n- A Class IIa medication-adherence app that had its MDR QMS and NB agreement in\n  place in time -> covered until **31 December 2028**.\n- A legacy app whose manufacturer **never signed an NB agreement by 26 Sep 2024**\n  -> does **not** benefit from the extension; its legacy cover has lapsed and it\n  cannot rely on these deadlines.\n\n## HERA dimensions touched\n- **Conformity transition** · **EU market access** · **Notified-body planning**\n- Cross-links: [[mdr_class_iib]] (2027 deadline), [[mdr_class_iia]] (2028 deadline), [[pms_lifecycle]] (PMS during transition), [[udi_eudamed]] (legacy devices still register)\n\n## Official sources\n- EUR-Lex — Regulation (EU) 2023/607: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R0607\n- European Commission — Q&A on the implementation of Reg. (EU) 2023/607 (transition extension + removal of sell-off): https://health.ec.europa.eu/latest-updates/qa-practical-aspects-related-implementation-regulation-eu-2023607-extension-mdr-transitional-period-2023-03-28_en\n", "national_ehealth": "# eHealth — national profiles (EPRA, DMP, ELGA)\n\n## Why this concerns you (purpose)\nIf your app must **read from or write to a national electronic health record** — the\nSwiss EPR/EPD, the French DMP/Mon espace santé, the Austrian ELGA — then \"speaking\nFHIR\" is not enough. Each country layers **national profiles, terminologies and a\nmandatory conformance/referencing process** on top of the international standards. You\ncannot connect to these systems unless your software is **certified/referenced** against\nthe national framework. This is the integration gate that turns a standalone app into a\nparticipant in the public health-data ecosystem.\n\n## When it is triggered (scope)\nTriggered when your app:\n- **feeds or consults** a national shared record (DMP, EPR/EPD, ELGA);\n- exchanges documents via the **national exchange infrastructure** (e.g. IHE XDS.b\n  document sharing, FHIR R4 APIs, MSSanté secure messaging in France);\n- claims **interoperability** as a condition of public funding or market access.\n\nIt is **not** triggered by purely internal data exchange that never touches a national\nrecord system — but note that national reimbursement schemes ([[diga_germany]],\n[[pecan_france]], [[reimbursement_other_eu]]) usually *require* this interoperability.\n\n## Concrete obligations\n- **Switzerland (EPRA/EPDG)** — conform to the EPR technical/integration profiles\n  (IHE-based) and use a certified core community/portal. A **full revision** is under\n  way: the Federal Council submitted the new act to Parliament on **5 Nov 2025**,\n  replacing the current opt-in EPR with a near-**mandatory opt-out** electronic health\n  record (HCP use mandated, patient control over access), targeted **~2028 at the\n  earliest**. Plan for the model shift. See [[swiss_stack]].\n- **France (Ségur du numérique / DMP)** — obtain **Ségur référencement** (Vague 1, now\n  Vague 2): software must implement **CI-SIS**, **FHIR R4** for new developments, feed\n  **Mon espace santé/DMP**, use **INS** (national patient identifier) and **MSSanté**.\n  Ségur is shifting from incentives toward **mandatory** requirements around 2026-2027.\n- **Austria (ELGA)** — comply with the ELGA Gesundheitstelematikgesetz (G-TG) profiles\n  (IHE XDS, CDA/FHIR) to connect to e-Befund / e-Medikation.\n- Cross-cutting: implement **IHE XDS** document sharing and/or **FHIR R4**, the national\n  **terminologies** (SNOMED CT, LOINC) and the national **patient/HCP identity** scheme.\n\n## Checklist\n- [ ] Identify each national record you must connect to (EPR/EPD, DMP, ELGA) and its profiles.\n- [ ] Implement FHIR R4 + IHE XDS and the required national terminologies (SNOMED CT, LOINC).\n- [ ] Obtain the national conformance: Ségur référencement (FR), EPR certification (CH), G-TG conformance (AT).\n- [ ] Integrate the national patient/HCP identifier (INS in FR) and secure messaging (MSSanté).\n- [ ] Track the Swiss EPRA revision (opt-out ~2028) and the FR Ségur shift to mandatory (2026-2027).\n\n## Examples (mHealth)\n- A French chronic-care app that pushes care summaries to **Mon espace santé/DMP** → must\n  pass **Ségur référencement**, use **INS** + FHIR R4 + CI-SIS, not just any FHIR server.\n- A Swiss medication-management app integrating with the **EPR** → must connect via a\n  certified community and IHE profiles; under the revision, prepare for the opt-out E-HR.\n- An app that stores data **only in its own backend** and never connects to a national\n  record → out of scope here (but interoperability may still be demanded for reimbursement).\n\n## HERA dimensions touched\n- **Interoperability & standards (FHIR/IHE)** · **National conformance/referencing** · **Patient/HCP identity** · **Public market access**\n- Cross-links: [[swiss_stack]] (EPRA in the Swiss framework), [[telehealth_national]] (clinical records), [[eidas2]] (identity attestations), [[pecan_france]] (FR interop as a funding condition), [[ehds]] (EU-level primary use / EEHRxF)\n\n## Official sources\n- Fedlex — Swiss EPRA/EPDG (Federal Act on the Electronic Patient Record): https://www.fedlex.admin.ch/eli/cc/2017/203/en\n- eHealth Suisse — Electronic Patient Record: https://www.e-health-suisse.ch/en/coordination/electronic-patient-record/the-epr\n- ANS — Doctrine du numérique en santé / interopérabilité (FR): https://esante.gouv.fr/doctrine/interoperabilite\n", "nis2_cyber": "# NIS2 — cybersecurity & incident notification\n\n## Why this concerns you (purpose)\nNIS2 (Dir. (EU) 2022/2555) governs the **cybersecurity of your organisation**, not your\nproduct. If you operate in the health sector as an **essential or important entity** —\nhealthcare providers, but also certain manufacturers of medical devices and providers of\ndigital health services — you must put in place **cyber risk-management measures** and\n**notify significant incidents** to your national authority/CSIRT on a strict clock.\nNIS2 is the **organisational counterpart** to the CRA's product rules (see [[cra]]) and\noverlaps with the device-cybersecurity requirements of MDR Annex I §17: a SaMD maker can\nface both the device security duties and NIS2 entity obligations at once.\n\n## When it is triggered (scope)\nTriggered when **all** of the following hold:\n- you are an **entity** providing services in a NIS2 sector — **health** is listed\n  (healthcare providers; also medical-device and IVD manufacturers as relevant);\n- you meet the **size threshold** (generally medium/large) **or** are otherwise\n  designated essential/important by a Member State;\n- you provide services in / are established in the **EU**.\n\nNote: classification as **essential** (proactive, ex-ante supervision) vs **important**\n(ex-post supervision) changes the intensity of oversight, not the core duties.\n\n## Concrete obligations\n- Implement the **Art. 21 risk-management measures**: risk analysis & security policies,\n  incident handling, business continuity/backup, supply-chain security, vulnerability\n  handling/disclosure, encryption, access control, MFA — proportionate to risk.\n- **Incident notification (Art. 23)** for significant incidents, in stages:\n  **early warning within 24h**, **incident notification within 72h**, and a **final\n  report within one month**.\n- Ensure **management bodies approve and oversee** cyber risk measures (and can be held\n  accountable); train staff.\n- Register your entity with the competent national authority and align device-side\n  controls with **MDR Annex I §17** where you make SaMD.\n\n## Checklist\n- [ ] Determine whether you are an essential/important entity (sector + size threshold) and register.\n- [ ] Implement the Art. 21 measures (backup, supply-chain, vulnerability handling, MFA, encryption).\n- [ ] Stand up an incident-response runbook hitting the **24h / 72h / 1-month** Art. 23 deadlines.\n- [ ] Reconcile NIS2 controls with MDR Annex I §17 device cybersecurity and CRA product duties.\n\n## Examples (mHealth)\n- A telemedicine platform classed as an essential health entity suffers a ransomware\n  outage → must send an early warning within 24h and a full notification within 72h.\n- A medium-sized SaMD manufacturer → likely an important entity: must run the Art. 21\n  programme even though its *product* security also sits under the CRA.\n- A two-person wellness-app startup below the size threshold and not designated →\n  generally outside NIS2 entity scope (but the CRA can still apply to its product).\n\n## HERA dimensions touched\n- **Organisational cybersecurity** · **Incident notification (24h/72h)** · **Supply-chain security**\n- Cross-links: [[cra]] (product security counterpart, SBOM, vuln handling)\n\n## Official sources\n- EUR-Lex — Directive (EU) 2022/2555: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022L2555\n- EUR-Lex (ELI) — Directive (EU) 2022/2555: https://eur-lex.europa.eu/eli/dir/2022/2555/oj/eng\n", "nlpd_automated_dpia": "# nFADP Art. 21 & 22 — automated decision + DPIA (Switzerland)\n\n## Why this concerns you (purpose)\nThe revised Swiss data-protection act (**nFADP**, in force since 1 September 2023) is a\n**distinct regime from the GDPR**, with its own supervisory authority — the **FDPIC** (Federal\nData Protection and Information Commissioner). Two provisions bite directly on mHealth apps that\n\"decide\" or that process health data at scale: **Art. 21** (automated individual decisions) and\n**Art. 22** (data protection impact assessment). They look similar to GDPR Art. 22 / 35 but are\n**not the same obligation** — doing a GDPR DPIA does **not** discharge the Swiss one, and the\ntriggers, wording and authority differ. If your app targets Switzerland, you must run the Swiss\nanalysis separately.\n\n## When it is triggered (scope)\n**Art. 21** is triggered when a decision is **based solely on automated processing** and\n**produces legal effects or significantly affects** the data subject (e.g. automated triage,\nrisk scoring, eligibility or treatment-path decisions).\n\n**Art. 22** (DPIA) is triggered when processing is **likely to entail a high risk** to the\ndata subject's personality or fundamental rights — including **large-scale processing of\nsensitive data** (health data is sensitive under nFADP Art. 5(c)), **high-risk profiling**, or\n**systematic large-scale monitoring**.\n\nBoth apply to apps targeting **Switzerland** under the nFADP, in parallel with their GDPR\ncounterparts ([[gdpr_automated]], [[gdpr_dpia]]) and on top of the nFADP baseline ([[nlpd_base]]).\n\n## Concrete obligations\n- **Art. 21:** **inform** the data subject that an automated individual decision is being made;\n  on request, give them the **right to express their point of view** and to **obtain human\n  review** of the decision.\n- **Art. 22:** carry out a **DPIA** before high-risk processing — describing the intended\n  processing, evaluating the risks to personality/fundamental rights, and setting the protective\n  measures.\n- **Residual high risk:** if the DPIA shows a high risk remains despite the planned measures,\n  **consult the FDPIC beforehand** — unless you have appointed a **data protection adviser**\n  (the Swiss DPO equivalent under SR 235.11) and consulted them on that processing.\n- Keep the analysis **separate from your GDPR DPIA / Art. 22 record**: same product, two regimes.\n\n## Checklist\n- [ ] Map any solely-automated decisions with significant effect, and build the Art. 21 inform +\n      human-review workflow.\n- [ ] Run an Art. 22 DPIA whenever you process Swiss health data at large scale or do high-risk profiling.\n- [ ] Decide your FDPIC route: prior consultation, or appoint a data protection adviser to avoid it.\n- [ ] Document the Swiss DPIA distinctly from any [[gdpr_dpia]] you already hold.\n\n## Examples (mHealth)\n- A mental-health app that **auto-refuses crisis escalation** based only on an algorithm for Swiss\n  users → Art. 21 applies: must inform and offer human review of the decision.\n- A symptom-checker processing **large-scale Swiss health data** with risk profiling → Art. 22 DPIA\n  required, even if a GDPR DPIA was already completed for the EU rollout.\n- An app where a clinician **always reviews and signs off** every recommendation (no solely-automated\n  decision) and that processes only a **handful** of Swiss users → **edge case: Art. 21 not triggered**\n  (human in the loop) and Art. 22 likely not triggered (no large-scale/high-risk processing).\n\n## HERA dimensions touched\n- **Swiss data protection** · **Automated decision-making** · **Impact assessment / FDPIC**\n- Cross-links: [[gdpr_automated]], [[gdpr_dpia]], [[nlpd_base]]\n\n## Official sources\n- Fedlex — Federal Act on Data Protection (nFADP, SR 235.1): https://www.fedlex.admin.ch/eli/cc/2022/491/en\n- FDPIC — Federal Data Protection and Information Commissioner: https://www.edoeb.admin.ch/en\n", "nlpd_base": "# nFADP — baseline (Swiss Federal Act on Data Protection)\n\n## Why this concerns you (purpose)\nIf your mHealth app serves users **in Switzerland**, your data-protection baseline is the\n**revised Federal Act on Data Protection (nFADP / revFADP, SR 235.1)**, in force since\n**1 September 2023** — **not** the GDPR. This is a common and costly mistake: Switzerland is\na separate sovereign regime with its **own** supervisory authority, its **own** vocabulary\nand its **own** thresholds. A GDPR-compliant setup is a good head start but does **not**\nautomatically satisfy the nFADP, and vice versa. If you target both markets, you must\nsatisfy **both** baselines in parallel — see [[gdpr_base]].\n\n## When it is triggered (scope)\nTriggered as soon as **any** of the following hold:\n- you process personal data of people **in Switzerland**;\n- your processing **has an effect in Switzerland** (the nFADP, like the GDPR, has\n  extraterritorial reach for foreign controllers targeting CH users);\n- your app handles **health data**, which the nFADP treats as **sensitive personal data**\n  (Art. 5(c)) — a category that also covers genetic and biometric data.\n\nNote the distinct concepts: the authority is the **FDPIC** (Federal Data Protection and\nInformation Commissioner), **not** an EU DPA; the in-house role is the **\"data protection\nadviser\"** (not a GDPR \"DPO\"); and Switzerland keeps its **own** adequacy list for\ntransfers (Annex 1 DPO), separate from the EU's — see [[gdpr_transfer]].\n\n## Concrete obligations\n- **Principles (Art. 6):** lawfulness, good faith, proportionality, purpose limitation —\n  no separate \"legal basis\" list as under GDPR Art. 6, but private processing is generally\n  permitted unless it breaches a principle or personality rights.\n- **Information at collection (Art. 19):** inform data subjects when collecting personal\n  data (broader than the old law, which only required it for sensitive data).\n- **Right of access (Art. 25):** answer access requests, in principle within 30 days.\n- **Record of processing (Art. 12):** maintain a register (SMEs <250 employees with\n  low-risk processing are exempt, but health data at scale removes that exemption).\n- **Security (Art. 8 + DPO ordinance SR 235.11):** appropriate technical/organisational\n  measures; specific minimum requirements set by ordinance.\n- **Breach notification:** report breaches to the **FDPIC** \"as quickly as possible\"\n  (Art. 24) — note this is **not** the GDPR's fixed 72-hour rule.\n- **Data protection adviser:** optional but recommended; appointing one is the single\n  point of contact with the FDPIC and can replace prior consultation for high-risk DPIAs.\n\n## Checklist\n- [ ] Confirm you are applying the **nFADP** (not the GDPR) to your Swiss user base.\n- [ ] Treat health data as **sensitive data (Art. 5(c))** and document the processing.\n- [ ] Provide an Art. 19 information notice at collection and an Art. 25 access workflow.\n- [ ] Maintain the Art. 12 record of processing and Art. 8 security measures.\n- [ ] Map breach reporting to the **FDPIC** (\"as quickly as possible\") and consider naming a data protection adviser.\n\n## Examples (mHealth)\n- A Swiss-only mental-wellness app logging mood entries → nFADP applies; mood/mental-state\n  data is **sensitive** under Art. 5(c); report any breach to the FDPIC, not to an EU DPA.\n- A French startup whose diabetes app is also offered to Swiss patients → must satisfy\n  **both** [[gdpr_base]] and the nFADP; a single GDPR privacy notice is **not** sufficient.\n- A B2B analytics tool used only by a Swiss hospital's internal staff (no CH consumer data\n  exported) → still nFADP for employee/processing data, but the GDPR baseline does **not**\n  apply absent EU users — a frequent over-stacking error.\n\n## HERA dimensions touched\n- **Data protection baseline (Swiss)** · **Sensitive-data handling** · **Authority & transfers (FDPIC)**\n- Cross-links: [[gdpr_base]] (the distinct EU regime — satisfy both for dual markets), [[nlpd_automated_dpia]] (Swiss automated decisions & DPIA), [[swiss_stack]] (MedDO/Swissmedic/EPRA), [[gdpr_transfer]] (Swiss adequacy list, Annex 1 DPO)\n\n## Official sources\n- Fedlex — Federal Act on Data Protection (FADP, SR 235.1): https://www.fedlex.admin.ch/eli/cc/2022/491/en\n- FDPIC — official website: https://www.edoeb.admin.ch/en\n", "pecan_france": "# PECAN (France) — early access reimbursement for digital devices\n\n## Why this concerns you (purpose)\nPECAN (\"prise en charge anticipée numérique\") is France's **early-access** reimbursement\nroute for digital medical devices: it lets statutory health insurance pay for your app\n**before** the full common-law listing, on a **presumption of innovation**, while you\ngenerate the clinical evidence. It is the French counterpart to Germany's DiGA. CE\nmarking authorises the market; PECAN is what gets you **paid by Assurance Maladie** for a\n**one-year, non-renewable** window — your runway to prove benefit and convert to the\npermanent LPP/LATM listing.\n\n## When it is triggered (scope)\nRelevant when you seek **early French reimbursement** (Decree **no. 2023-232 of 30 March\n2023**, under **Art. L162-1-23 SSC**) for a digital medical device that is either:\n- **therapeutic (DTx)** → targets listing on the **LPP** (LPPR); or\n- a **medical télésurveillance** device → targets the **LATM** (remote-monitoring list).\n\nIt is **not** for non-medical wellness apps, and the early window is **one year,\nnon-renewable** — you must transition to the common-law pathway before it ends, or\ncoverage stops. An app that cannot produce credible clinical evidence in 12 months is a\npoor PECAN fit.\n\n## Concrete obligations\n- **Dual filing** — two parallel dossiers:\n  - **ANS certificate of conformity** on **interoperability + security** (submitted via\n    the **CONVERGENCE** platform);\n  - **HAS clinical dossier** assessed by the **CNEDiMTS** (submitted via the **Sesame**\n    platform), establishing the presumption of innovation/benefit.\n- **Tariff** (Order of **22 April 2024**, per patient): a flat **EUR 435 incl. tax for\n  the first 3 months** (single instalment), then **EUR 38.30/month** from the 4th month,\n  with a **cap of EUR 780/year/patient**.\n- **Interoperability/security**: meet ANS frameworks (couples with Ségur/DMP — see\n  [[national_ehealth]]) and host French health data with an HDS-certified host (see\n  [[hds_certification]]).\n- **Evidence during the year**: run the study committed in the dossier so you can apply\n  for permanent LPP/LATM listing before the 12 months elapse.\n\n## Checklist\n- [ ] Confirm your device is a CE-marked DTx (→ LPP) or télésurveillance device (→ LATM).\n- [ ] Prepare the ANS interoperability + security conformity dossier (CONVERGENCE).\n- [ ] Prepare the HAS/CNEDiMTS clinical dossier (Sesame) for the presumption of innovation.\n- [ ] Budget against the tariff: EUR 435 first 3 months, then EUR 38.30/month, cap EUR 780/yr/patient.\n- [ ] Plan the evidence-generation study to transition to permanent LPP/LATM within the 1-year window.\n\n## Examples (mHealth)\n- A CE-marked DTx for chronic-pain therapy files for PECAN → ANS conformity + HAS\n  dossier; reimbursed at EUR 435 then EUR 38.30/month while it runs its confirmatory study.\n- A heart-failure **télésurveillance** app targets the **LATM** route under PECAN, then\n  converts to permanent télésurveillance listing once benefit is shown.\n- A device whose publisher hopes to **stay** on PECAN beyond a year → not possible: the\n  one-year access is **non-renewable**; without the permanent listing, coverage ends.\n\n## HERA dimensions touched\n- **French market access / Assurance Maladie reimbursement** · **Interoperability & security (ANS)** · **Clinical evidence (HAS/CNEDiMTS)** · **Health-data hosting**\n- Cross-links: [[hds_certification]] (HDS hosting of FR health data), [[national_ehealth]] (ANS/Ségur interoperability), [[diga_germany]] (German counterpart), [[telehealth_national]] (télésurveillance as a regulated act)\n\n## Official sources\n- HAS — Dispositifs médicaux numériques : la prise en charge anticipée (PECAN): https://www.has-sante.fr/jcms/p_3376633/fr/dispositifs-medicaux-numeriques-la-prise-en-charge-anticipee\n- Légifrance — Décret n° 2023-232 du 30 mars 2023: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000047377863\n- Légifrance — Arrêté du 22 avril 2024 (tariff framework): https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000049467872\n", "pld": "# PLD — Product Liability Directive (software & AI)\n\n## Why this concerns you (purpose)\nThe revised Product Liability Directive (Dir. (EU) 2024/2853, replacing 85/374/EEC)\nmakes **software and AI systems explicitly \"products\"**. That means if your mHealth\napp, SaMD or AI model causes harm — physical injury, a damaged health outcome, even\ndata corruption — an injured person can claim compensation under a **no-fault (strict\nliability)** regime: they do **not** have to prove you were negligent, only that the\nproduct was **defective** and caused the damage. Crucially, the directive **eases the\nburden of proof** for claimants in technically complex cases (presumption of\ndefectiveness/causation) and lets courts **order you to disclose evidence**. A missing\nrequired security update or a wrong AI output can each be a \"defect\". Transposition is\ndue by **9 December 2026**, applying to products placed on the market after that date.\n\n## When it is triggered (scope)\nTriggered when **all** of the following hold:\n- you place on the EU market (or put into service) **software, an AI system, or a\n  digital product** — including firmware, apps and SaMD — **after 9 Dec 2026**;\n- the product can be **defective** (does not provide the safety a person is entitled to,\n  considering use, foreseeable misuse, and required updates);\n- the defect **causes damage** to a natural person (death, personal injury, certain\n  property damage, or destruction/corruption of data not used professionally).\n\nEdge: harm a *deployer* or *user* causes through their own misuse, unconnected to a\ndefect, is not your strict-liability exposure — but inadequate instructions or a failure\nto supply security updates can themselves make the product defective.\n\n## Concrete obligations\n- This is a **liability** regime, not a CE-marking checklist: the duties are practical\n  risk-reduction and evidence readiness.\n- Treat **failure to provide required security updates/upgrades** as a potential defect —\n  align your update commitments with the CRA support period (see [[cra]]).\n- Keep robust **technical documentation, logs and risk records** — courts can order\n  disclosure, and gaps can trigger a **presumption of defectiveness** against you.\n- Consider product-liability **insurance** and clear allocation of responsibility across\n  your supply chain (component makers, model providers, integrators).\n\n## Checklist\n- [ ] Inventory which of your products will be \"placed on the market after 9 Dec 2026\" (in scope).\n- [ ] Document defect-avoidance: risk management, change logs, security-update commitments.\n- [ ] Ensure you can produce evidence on demand (disclosure duty) to rebut the eased-proof presumptions.\n- [ ] Review insurance + contractual liability allocation with component and AI-model suppliers.\n\n## Examples (mHealth)\n- A dosing-support app that recommends an unsafe insulin dose because of a defect →\n  the injured patient can claim under strict liability without proving fault.\n- An AI triage assistant that misclassifies an emergency due to a flawed update →\n  the defective update can ground PLD liability; weak logs trigger the proof presumption.\n- A wellness step-counter with a cosmetic UI bug causing no injury or data loss →\n  no recoverable damage, so no PLD claim arises.\n\n## HERA dimensions touched\n- **Product liability & defect exposure** · **Evidence/documentation readiness** · **AI accountability**\n- Cross-links: [[cra]] (missing security update = potential defect), [[ai_act_high_risk]] (defective AI output)\n\n## Official sources\n- EUR-Lex — Directive (EU) 2024/2853: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024L2853\n- EUR-Lex (ELI) — Directive (EU) 2024/2853: https://eur-lex.europa.eu/eli/dir/2024/2853/oj/eng\n", "pms_lifecycle": "# Post-Market Surveillance & lifecycle\n\n## Why this concerns you (purpose)\nCE marking is the start of your obligations, not the end. Once your SaMD is on the\nmarket, the MDR requires you to **actively watch how it performs in the real world**,\nfeed problems back into your design, and report serious incidents. For software used\nover the long term — and especially AI-driven software — this proactive\n**post-market surveillance (PMS)** loop is where most ongoing compliance effort\nlives, and it stacks an **AI Act** layer and a **separate Swiss** layer on top.\n\n## When it is triggered (scope)\nTriggered whenever your device/SaMD is **placed on the EU market and used over\ntime** (the long-term-use path). PMS scales with risk class. If the software uses\n**high-risk AI**, AI Act post-market monitoring stacks on top ([[ai_act_high_risk]]).\nIf you are also on the **Swiss** market, a **distinct Swissmedic vigilance** regime\napplies in parallel — Switzerland is a third country, so reporting does **not** flow\nthrough EUDAMED ([[swiss_stack]]).\n\n## Concrete obligations\n- Maintain a **PMS system** proportionate to the device (MDR **Art. 83**) and a\n  documented **PMS Plan** in the technical documentation (**Art. 84**, Annex III).\n- **Class I**: keep a **PMS report** up to date (**Art. 85**). **Class IIa/IIb/III**:\n  produce and update a **Periodic Safety Update Report (PSUR)** (**Art. 86**),\n  summarising PMS data, benefit-risk conclusions and corrective actions.\n- Run **post-market clinical follow-up (PMCF)** and feed it back into the clinical\n  evaluation report ([[clinical_eval_mdsw]]).\n- For **high-risk AI**, operate **AI Act Art. 72** post-market monitoring (collect\n  and analyse performance data across the lifecycle), aligned where possible with\n  the MDR PMS so you run one integrated system.\n- **Switzerland**: report serious incidents to Swissmedic using the **Manufacturer\n  Incident Report (MIR)** form — **MIR version 7.3.1 is mandatory from 1 May 2026**.\n\n## Checklist\n- [ ] Maintain a PMS Plan (Art. 84) and the matching PMS report or PSUR for your class.\n- [ ] Define data sources, indicators and thresholds; run periodic benefit-risk review.\n- [ ] Wire PMCF outputs back into the clinical evaluation report.\n- [ ] If high-risk AI, integrate AI Act Art. 72 monitoring into the same loop.\n- [ ] For the Swiss market, adopt the MIR 7.3.1 form for incident reports from 1 May 2026.\n\n## Examples (mHealth)\n- A Class IIa sleep-apnoea screening app -> PMS Plan + PSUR, with PMCF tracking\n  real-world sensitivity/specificity drift ([[mdr_class_iia]]).\n- An AI symptom-checker classified high-risk -> one integrated MDR + AI Act Art. 72\n  monitoring loop watching for model performance degradation.\n- A Class I wellness-adjacent logging app placed on the EU market -> still owes an\n  Art. 85 PMS report; \"low risk\" does **not** mean \"no PMS\".\n\n## HERA dimensions touched\n- **Post-market surveillance & vigilance** · **AI lifecycle monitoring** · **Swiss vigilance**\n- Cross-links: [[mdr_class_iia]] (PSUR by class), [[swiss_stack]] (Swissmedic MIR 7.3.1), [[clinical_eval_mdsw]] (PMCF loop), [[ai_act_high_risk]] (Art. 72)\n\n## Official sources\n- EUR-Lex — MDR (Regulation (EU) 2017/745), Art. 83-86: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02017R0745-20230320\n- Swissmedic — Reporting incidents (MIR 7.3.1 mandatory from 1 May 2026): https://www.swissmedic.ch/swissmedic/en/home/medical-devices/reporting-incidents---fscas/hersteller---inverkehrbringer.html\n", "reimbursement_other_eu": "# Other national reimbursement schemes (Belgium mHealthBelgium, etc.)\n\n## Why this concerns you (purpose)\nBeyond Germany (DiGA) and France (PECAN), **most EU member states run their own**\nstatutory-insurance pathway for digital health apps — and the pattern is consistent:\nCE marking is the entry ticket, but **national clinical/health-economic evidence plus a\nnational interoperability & security validation** are what unlock reimbursement. If your\nbusiness model depends on being **paid by a national payer**, you must navigate each\ntarget country's scheme separately. Belgium's **mHealthBelgium** is the clearest\nworked example.\n\n## When it is triggered (scope)\nRelevant when you seek **public reimbursement / payer listing** in an EU country **other\nthan DE or FR**, e.g.:\n- **Belgium** — the **mHealthBelgium** validation pyramid (M1 → M2 → M3);\n- other MS schemes (e.g. NL with its conditional evaluation routes, AT, the Nordics).\n\nIt is **not** triggered if you only place the device on the market without seeking public\nfunding (CE marking suffices to sell). Note these schemes are **national, additive** to\nCE/MDR — clearing the MDR does **not** by itself grant any reimbursement.\n\n## Concrete obligations\n- **Belgium — mHealthBelgium 3-level pyramid** (apps always enter at the bottom and\n  climb):\n  - **M1** — basics: **CE marking** as a medical device, **GDPR** compliance, and\n    **product notification to the AFMPS/FAGG** (the Belgian medicines & health-products\n    agency).\n  - **M2** — **interoperability & security** criteria via the eHealth platform (incl.\n    user identification/authentication, connection to the eHealth services).\n  - **M3** — **reimbursement**: demonstrate socio-economic added value to the **NIHDI/RIZIV\n    (INAMI)**; reimbursement runs through conventions with the payer (the first M3 apps —\n    chronic heart-failure remote monitoring — reached reimbursement via a NIHDI/RIZIV\n    convention launched early 2025).\n- **Cross-cutting (any MS)**: prepare **clinical + health-economic evidence**, meet the\n  **national interoperability & security certification**, and host health data lawfully\n  (HDS in France — see [[hds_certification]]; national rules elsewhere).\n- Plan **per-country**: evidence requirements, tariffs and timelines differ; a single\n  dossier rarely transfers across borders.\n\n## Checklist\n- [ ] Identify each target country's scheme and its evidence + interoperability requirements.\n- [ ] For Belgium: secure M1 (CE + GDPR + AFMPS notification), then M2 (eHealth interop/security).\n- [ ] Build the health-economic dossier needed for M3 / NIHDI-RIZIV (or the national payer).\n- [ ] Map national security/interoperability certifications to your existing MDR + GDPR work.\n- [ ] Budget separate clinical/health-economic studies per market (limited cross-border reuse).\n\n## Examples (mHealth)\n- A remote-monitoring app for **chronic heart failure** climbs Belgium's pyramid M1→M2→M3\n  and is reimbursed through a NIHDI/RIZIV convention with participating hospitals.\n- A CE-marked DTx already listed under **DiGA** in Germany → must still go through\n  Belgium's M1/M2/M3 independently; the German listing does **not** carry over.\n- A wellness app **not** seeking public funding → can be sold on CE marking alone; no\n  mHealthBelgium validation needed (M2/M3 are only relevant if you want reimbursement).\n\n## HERA dimensions touched\n- **Multi-country market access / payer listing** · **Clinical & health-economic evidence** · **National interoperability & security** · **Notification to national authorities**\n- Cross-links: [[diga_germany]] (German scheme), [[pecan_france]] (French scheme), [[hds_certification]] (FR health-data hosting), [[national_ehealth]] (national interoperability), [[mdr_class_iia]] (CE-marking prerequisite)\n\n## Official sources\n- mHealthBelgium — Validation pyramid (M1/M2/M3): https://mhealthbelgium.be/validation-pyramid\n- mHealthBelgium — platform home: https://mhealthbelgium.be/\n", "samd_standards": "# SaMD lifecycle standards (IEC 62304, ISO 14971, IEC 62366-1, ISO 13485)\n\n## Why this concerns you (purpose)\nOnce your app is a medical device — at **any** MDR class ([[mdr_class_i]] →\n[[mdr_class_iii]]) or as IVD software ([[ivdr_class]]) — you must show it meets the\n**General Safety & Performance Requirements** (MDR/IVDR Annex I). You don't prove that\nfrom scratch: you **apply a recognised set of standards** that the Notified Body and\nauditors expect. These four are the backbone of every SaMD technical file. Skipping them\nis the fastest way to fail an audit; applying them is how \"we built it carefully\" becomes\n**demonstrable conformity**.\n\n## When it is triggered (scope)\nTriggered for **any classified SaMD or IVD-MDSW**, regardless of class. The four\nstandards play distinct, complementary roles:\n- **IEC 62304** — medical-device **software lifecycle** (planning, requirements,\n  architecture, verification, maintenance, problem resolution; software safety classes A/B/C).\n- **ISO 14971** — **risk management** across the whole lifecycle (risk analysis,\n  controls, benefit-risk, post-production monitoring).\n- **IEC 62366-1** — **usability engineering** (design out use-errors that could harm).\n- **ISO 13485** — the **quality management system** wrapping all of the above.\n\n## Concrete obligations\n- **Harmonisation status matters:** **ISO 14971** (risk) and **ISO 13485** (QMS) are\n  **harmonised under MDR** — applying them gives a *presumption of conformity*.\n- **IEC 62304** and **IEC 62366-1** are **not formally harmonised** but are accepted as\n  **state of the art** (MDCG 2021-5 logic): Notified Bodies expect the **current edition**\n  even absent harmonisation. (A revised IEC 62304 edition is expected ~Sep 2026 — track it.)\n- Maintain a **traceable chain**: ISO 14971 risks → IEC 62304 software requirements/verification\n  → IEC 62366-1 usability validation, all governed by the ISO 13485 QMS.\n- Feed this evidence into the **clinical evaluation/performance evaluation**\n  ([[clinical_eval_mdsw]]) and the **technical file** for the relevant class.\n- Keep it **live** post-market: changes, CAPAs and vigilance loop back through the QMS\n  and risk file ([[pms_lifecycle]]).\n\n## Checklist\n- [ ] Stand up an ISO 13485 QMS (or document a roadmap to it) sized to your class.\n- [ ] Maintain an ISO 14971 risk-management file linked to design controls.\n- [ ] Run IEC 62304 lifecycle activities at the correct software safety class (A/B/C).\n- [ ] Complete IEC 62366-1 usability engineering incl. summative evaluation.\n- [ ] Verify you cite the **current** editions (watch the upcoming IEC 62304 revision).\n\n## Examples (mHealth)\n- A Class IIa triage app: IEC 62304 (safety class likely B/C), ISO 14971 risk file,\n  IEC 62366-1 usability study, all under an ISO 13485 QMS → audit-ready technical file.\n- An IVD-MDSW genetic-risk app ([[ivdr_class]]) uses the **same four standards** to meet\n  the IVDR Annex I GSPR — the standards are device-type-agnostic.\n- **Edge/negative:** a **wellness** app (no medical purpose) is **not** obliged to apply\n  these for conformity — it should look to [[iso_82304]] instead; borrowing ISO 14971\n  risk discipline is good practice but not a regulatory requirement there.\n\n## HERA dimensions touched\n- **Standards & conformity evidence** · **QMS / lifecycle / risk / usability** · **Audit readiness**\n- Cross-links: [[mdr_class_i]] · [[mdr_class_iia]] · [[mdr_class_iib]] · [[mdr_class_iii]] ·\n  [[ivdr_class]] · [[clinical_eval_mdsw]] · [[pms_lifecycle]] · [[iso_82304]]\n\n## Official sources\n- European Commission — harmonised standards for medical devices (MDR): https://single-market-economy.ec.europa.eu/single-market/goods/european-standards/harmonised-standards/medical-devices_en\n- IEC 62304 — medical device software life-cycle processes: https://www.iso.org/standard/38421.html\n- ISO 14971:2019 — risk management for medical devices: https://www.iso.org/standard/72704.html\n", "swiss_stack": "# Swiss stack (MedDO + Swissmedic + EPRA)\n\n## Why this concerns you (purpose)\nIf you place your mHealth app on the Swiss market, you do **not** inherit EU compliance\nautomatically. Switzerland runs a **parallel regulatory stack**: the **MedDO/ODim**\n(Medical Devices Ordinance, SR 812.213 — the MDR-equivalent), **Swissmedic** as the\ncompetent authority and vigilance regulator, and the **EPRA/EPDG** electronic-patient-record\nframework. Crucially, Switzerland is **not directly bound by the EU AI Act or the EHDS** —\nthose EU instruments do not extend across the border. Treating \"CE-marked = Swiss-compliant\"\nis the classic mistake: it gets you most of the technical content, but none of the Swiss-specific\nactor, registration and vigilance duties.\n\n## When it is triggered (scope)\nTriggered as soon as **any** of the following holds:\n- you place a **medical device / SaMD** (per MedDO, which mirrors MDR qualification rules) on the **Swiss market**;\n- you carry out **vigilance / post-market** activity for a device made available in Switzerland or Liechtenstein;\n- you connect to or feed the **Swiss electronic patient record (EPR/EPD)** under the EPRA/EPDG.\n\nIt applies **on top of** Swiss data-protection law (the nFADP), not instead of it — combine this\ncard with [[nlpd_base]] and, for automated decisions / high-risk processing, [[nlpd_automated_dpia]].\n\n## Concrete obligations\n- Qualify and class your software under **MedDO (SR 812.213)**, which transposes the MDR\n  substance (Rule 11, GSPR, technical documentation) into Swiss law.\n- Operate **Swissmedic vigilance**: serious incidents occurring in **Switzerland or Liechtenstein**\n  are reported to Swissmedic on the **Manufacturer Incident Report (MIR)** form — note that\n  **MIR version 7.3.1 becomes mandatory for Swissmedic notifications from 1 May 2026**.\n- Appoint the Swiss-specific actors when your seat is outside Switzerland (Swiss authorised\n  representative / CH-REP, importer duties) — see [[ch_rep_meddo]].\n- If you integrate with the Swiss **EPR**, track the **EPRA/EPDG full revision**: the bill was\n  submitted to **Parliament on 5 November 2025** and moves the EPR toward an **opt-out** model\n  with mandatory professional use, targeted to enter into force **around 2028 at the earliest**.\n  See [[national_ehealth]].\n\n## Checklist\n- [ ] Confirm MedDO qualification/classification and keep the technical file Swiss-ready (SR 812.213).\n- [ ] Set up a Swissmedic vigilance process and adopt the **MIR 7.3.1** form before **1 May 2026**.\n- [ ] Verify whether a CH-REP and Swiss registration are required for your seat ([[ch_rep_meddo]]).\n- [ ] Pair this stack with Swiss data-protection duties ([[nlpd_base]], [[nlpd_automated_dpia]]).\n- [ ] Do **not** assume EU AI Act / EHDS apply in Switzerland — treat them as separate from this stack.\n\n## Examples (mHealth)\n- A German-made diabetes SaMD sold in Switzerland → must meet MedDO, appoint a CH-REP, and\n  report any serious incident in Switzerland to Swissmedic via the MIR form.\n- A Swiss telemonitoring app whose serious incident in Geneva occurs in **April 2026** → may still\n  use the legacy MIR form, but from **1 May 2026** must switch to MIR 7.3.1 for Swissmedic.\n- A **pure wellness** step-counter with no medical purpose and no Swiss device claim → **out of the\n  MedDO/Swissmedic limb** of this stack (still subject to the nFADP if it processes Swiss data).\n\n## HERA dimensions touched\n- **Swiss market access** · **Medical-device qualification** · **Vigilance & post-market** · **National eHealth**\n- Cross-links: [[ch_rep_meddo]], [[nlpd_base]], [[nlpd_automated_dpia]], [[national_ehealth]]\n\n## Official sources\n- Fedlex — MedDO / Medical Devices Ordinance (SR 812.213): https://www.fedlex.admin.ch/eli/cc/2020/552/en\n- Swissmedic — Swiss authorised representative (CH-REP): https://www.swissmedic.ch/swissmedic/en/home/medical-devices/market-access/ch-rep.html\n- eHealth Suisse — current status of the EPR (EPRA/EPDG revision): https://www.e-health-suisse.ch/en/coordination/electronic-patient-record/de-aktueller-stand\n", "telehealth_national": "# Telehealth — national health codes\n\n## Why this concerns you (purpose)\nThe moment your app lets a patient consult, be remotely monitored by, or exchange\nclinical information with a **healthcare professional (HCP)**, you stop being \"just an\napp\" and start operating inside the **practice-of-medicine** rules of each country.\nThese rules are national (not harmonised by the MDR or GDPR): they govern **who may\ntreat**, **medical confidentiality**, **informed consent for the remote act**, and\n**how long the medical record must be kept**. Breaching them can void the lawfulness of\nthe care act itself — independently of your CE marking or GDPR posture.\n\n## When it is triggered (scope)\nTriggered as soon as your product **mediates a regulated health act**, e.g.:\n- **teleconsultation** (a doctor consults a patient at a distance);\n- **tele-expertise** (one HCP seeks the opinion of another);\n- **remote monitoring / télésurveillance** of a patient by an HCP;\n- **e-prescription** or transmission of medical results to/from an HCP.\n\nIt is **not** triggered by a pure self-care/wellness app with **no HCP in the loop**\n(those stay under wellness + GDPR rules). A patient-facing symptom diary that no\nclinician ever reads does not, by itself, trigger the telehealth regime.\n\n## Concrete obligations\n- **France** — medical confidentiality (PHC **Art. L1110-4**) covers *all* information\n  known to anyone in contact with the care activity; teleconsultation must respect the\n  acts framework (PHC **Art. L4131-1** for the practice of medicine, plus the\n  télémédecine articles **R6316-1 et seq.**): HCP identification, patient information\n  and consent, and traceability of the act in the record.\n- **Retention** — the patient record must be kept **20 years** from the last\n  stay/consultation (PHC **Art. R1112-7**), extended to the patient's 28th birthday for\n  minors, and at least 10 years from death.\n- **Switzerland** — the practice of medicine is governed by the **Medical Professions\n  Act (MedPA / MedBG-LPMéd)** plus cantonal health laws; the **FMH professional rules\n  (rev. 2023)** explicitly allow remote consultation provided the duties to **inform**\n  and to **document** are met. Medical secrecy is protected (Swiss Criminal Code Art.\n  321); patient records are generally kept **~20 years** (post-2020 limitation reform;\n  some cantons/EPR rules differ).\n- Keep an auditable **act log** (who, when, what) and a lawful **identification** of\n  both patient and HCP (see [[eidas2]]).\n\n## Checklist\n- [ ] Map every act your app mediates to a regulated category (teleconsultation, télé-expertise, télésurveillance, e-prescription).\n- [ ] Confirm only duly-registered HCPs can perform the act, with verified identity.\n- [ ] Implement confidentiality + access controls per PHC L1110-4 / Swiss medical secrecy.\n- [ ] Set record retention to 20 years (FR R1112-7) and document your CH cantonal basis.\n- [ ] Log each act (HCP, patient, timestamp, content) for traceability and audit.\n\n## Examples (mHealth)\n- A teleconsultation app connecting French patients to GPs → full telehealth regime:\n  HCP identification, L1110-4 confidentiality, consent for the remote act, 20-year record.\n- A diabetes **télésurveillance** app where a nurse reviews glucose trends and adjusts\n  follow-up → regulated remote-monitoring act (and may trigger reimbursement, see\n  [[pecan_france]] LATM pathway).\n- A meditation/sleep app with **no clinician** ever reviewing data → out of the telehealth\n  regime (stays wellness + GDPR); confidentiality rules don't attach to a care act.\n\n## HERA dimensions touched\n- **Clinical act & professional rules** · **Medical confidentiality** · **Record retention** · **National market access**\n- Cross-links: [[hds_certification]] (FR health-data hosting), [[national_ehealth]] (record interop), [[eidas2]] (HCP/patient identification), [[pecan_france]] (remote-monitoring reimbursement)\n\n## Official sources\n- Légifrance — Public Health Code (consolidated): https://www.legifrance.gouv.fr/codes/texte_lc/LEGITEXT000006072665/\n- Légifrance — PHC Art. L1110-4 (medical confidentiality): https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000043895798\n- Légifrance — PHC Art. R1112-7 (20-year record retention): https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000036658351\n", "udi_eudamed": "# UDI & EUDAMED registration\n\n## Why this concerns you (purpose)\nIf you place a CE-marked SaMD on the EU market, the device and **you, the\nmanufacturer**, must be traceable in the EU's central database. The MDR requires\na **Unique Device Identifier (UDI)** so any device can be tracked from production\nto use, and registration in **EUDAMED** (the European Database on Medical Devices)\nso authorities, notified bodies and the public can see who placed what on the\nmarket. Until 28 May 2026 EUDAMED use was largely **voluntary**; since that date the\nfirst four modules are **mandatory** — without registration your device is no longer\nlawfully on the market.\n\n## When it is triggered (scope)\nTriggered as soon as **both** hold:\n- you place a **CE-marked medical device / SaMD** (any class) on the EU market, or\n  you are an importer, authorised representative, system/procedure-pack producer,\n  or sponsor of a clinical investigation;\n- the device is intended for the **EU/EEA market** (not pure R&D or non-EU export).\n\nIt applies to **software regardless of risk class** (even Class I self-certified)\nand **even to legacy MDD devices** still benefiting from the transition period\n([[mdr_transition]]). It does **not** make your device traceable on the Swiss\nmarket — Switzerland is a third country and uses its own swissdamed; EUDAMED is\ninaccessible to Swissmedic ([[swiss_stack]]).\n\n## Concrete obligations\n- Obtain a **Basic UDI-DI** (the key device-model identifier used in EUDAMED and\n  documentation) and a **UDI-DI** for each commercial version/configuration of the\n  software, plus a **UDI-PI** (production identifier, e.g. software version).\n- Register as an **economic operator** first: obtain a Single Registration Number\n  (**SRN**) via the Actor registration module.\n- Register the **device** in the UDI/Device module **before** placing it on the\n  market. The **first four modules became mandatory on 28 May 2026** (Decision (EU)\n  2025/2371, published 27 Nov 2025, triggering the 6-month period under Reg. (EU)\n  2024/1860): Actor registration, UDI/Device, Notified Bodies & Certificates, and\n  Market Surveillance.\n- **Devices already on the market** before 28 May 2026 must be registered by\n  **28 November 2026** (12 months after the notice).\n- For software, assign a **new UDI-DI** on a significant change and a **new UDI-PI**\n  on each new version per the device's change-control rules.\n\n## Checklist\n- [ ] Obtain your Basic UDI-DI and per-version UDI-DI/UDI-PI from an issuing entity (e.g. GS1, HIBCC).\n- [ ] Register as an actor and secure your SRN now — the four modules are mandatory since 28 May 2026.\n- [ ] Register every device in the UDI/Device module before placing it on the EU market.\n- [ ] Diarise the 28 Nov 2026 backlog deadline for devices already on the market.\n- [ ] Wire UDI assignment into your release/versioning process (new version -> new UDI-PI).\n\n## Examples (mHealth)\n- A Class IIa diabetes-management app newly CE-marked in 2026 -> obtain Basic UDI-DI\n  + UDI-DI, register as actor (SRN), and register the device before launch\n  ([[mdr_class_iia]]).\n- A legacy MDD symptom-checker app on the market since 2020 under the transition\n  -> still needs an SRN and must be EUDAMED-registered by 28 November 2026.\n- A purely Swiss teleconsultation SaMD with **no** EU placement -> out of EUDAMED\n  scope; it registers in swissdamed instead, not EUDAMED.\n\n## HERA dimensions touched\n- **Traceability & registration** · **EU market access** · **Lifecycle/versioning**\n- Cross-links: [[mdr_class_iia]] (per-class registration), [[pms_lifecycle]] (vigilance feeds Market Surveillance), [[mdr_transition]] (legacy backlog)\n\n## Official sources\n- European Commission — EUDAMED overview: https://health.ec.europa.eu/medical-devices-eudamed/overview_en\n- European Commission — \"EUDAMED four first modules mandatory from 28 May 2026\" (27 Nov 2025): https://health.ec.europa.eu/latest-updates/eudamed-four-first-modules-will-be-mandatory-use-28-may-2026-2025-11-27_en\n"};
const Q = Object.fromEntries(TREE.questions.map(q => [q.id, q]));
const X = Object.fromEntries(TREE.exits.map(e => [e.id, e]));
const REG = Object.fromEntries(TREE.regulations.map(r => [r.id, r]));

let state = { current: TREE.start, history: [], added: [], jurisdiction: null };
// history entries: { node, answerLabel, addedIds: [...] }  (addedIds = regs newly added by that answer)
// jurisdiction = value chosen at Q1 (start): 'eu' | 'ch' | 'both' | 'none' | null

function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function activeRegs(){
  // ordered unique list of accumulated regulation ids
  const seen = new Set(), out = [];
  for (const id of state.added){ if(!seen.has(id)){ seen.add(id); out.push(id); } }
  return out;
}

// Territorial scope: an EU-only card does not bind a Switzerland-only app, and vice versa.
function inScope(id){
  const j = state.jurisdiction;
  if (!j || j === "both" || j === "none") return true;
  const cj = (REG[id]||{}).jurisdiction;
  if (j === "eu") return cj !== "CH";
  if (j === "ch") return !(cj === "EU" || cj === "FR" || cj === "DE");
  return true;
}

// --- minimal Markdown renderer for the rich cards ---------------------------
function mdInline(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\[\[([a-z0-9_]+)\]\]/gi, (m,id) =>
    `<a class="xlink" data-card="${id}">${REG[id] ? esc(REG[id].title.split(" —")[0].split(" (")[0]) : id}</a>`);
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // auto-link bare URLs (not already inside an href="..."), trimming trailing punctuation
  s = s.replace(/(^|[^"'=>])(https?:\/\/[^\s<)]+)/g, (m, pre, url) => {
    let tail = "";
    while (/[.,;:]$/.test(url)){ tail = url.slice(-1) + tail; url = url.slice(0, -1); }
    return `${pre}<a href="${url}" target="_blank">${url}</a>${tail}`;
  });
  return s;
}
function mdToHtml(md){
  const lines = (md||"").split("\n");
  let html = "", inList = false;
  const closeList = () => { if (inList){ html += "</ul>"; inList = false; } };
  for (const raw of lines){
    const line = raw.replace(/\s+$/, "");
    if (!line.trim()){ closeList(); continue; }
    let m;
    if (/^#\s+/.test(line)){ closeList(); continue; } // skip H1 (title shown already)
    if (/^##\s+/.test(line)){ closeList(); html += `<h4>${mdInline(line.replace(/^##\s+/, ""))}</h4>`; continue; }
    if (m = line.match(/^- \[( |x|X)\]\s+(.*)/)){
      if (!inList){ html += '<ul class="md-check">'; inList = true; }
      html += `<li>${m[1].trim() ? "&#9745;" : "&#9744;"} ${mdInline(m[2])}</li>`; continue;
    }
    if (m = line.match(/^[-*]\s+(.*)/)){
      if (!inList){ html += "<ul>"; inList = true; }
      html += `<li>${mdInline(m[1])}</li>`; continue;
    }
    closeList(); html += `<p>${mdInline(line)}</p>`;
  }
  closeList();
  return html;
}
function toggleRich(id, btn){
  const box = document.getElementById("rc-" + id);
  if (!box) return;
  if (box.dataset.loaded !== "1"){ box.innerHTML = mdToHtml(RICH[id]); box.dataset.loaded = "1"; }
  const show = box.style.display === "none";
  box.style.display = show ? "block" : "none";
  if (btn) btn.innerHTML = "Read full card " + (show ? "&#9662;" : "&#9656;");
}
function openOverlay(id){
  const r = REG[id]; if (!r || !RICH[id]) return;
  document.getElementById("overlay-body").innerHTML =
    `<div class="ovhead"><span class="rt">${esc(r.title)}</span><span class="rj">${esc(r.jurisdiction)}</span></div>` + mdToHtml(RICH[id]);
  document.getElementById("overlay-bg").style.display = "flex";
}
function closeOverlay(){ document.getElementById("overlay-bg").style.display = "none"; }

document.addEventListener("click", (e) => {
  const btn = e.target.closest(".rcbtn");
  if (btn){ toggleRich(btn.dataset.card, btn); return; }
  const xl = e.target.closest(".xlink");
  if (xl){ openOverlay(xl.dataset.card); return; }
  if (e.target.id === "overlay-bg" || e.target.closest("#ovclose")){ closeOverlay(); return; }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOverlay(); });

function regCard(id){
  const r = REG[id]; if(!r) return "";
  const arts = (r.key_articles||[]).join(" · ");
  const link = r.official_url ? `<a href="${esc(r.official_url)}" target="_blank">official source &rarr;</a>` : "";
  const oos = !inScope(id);
  const jurLabel = state.jurisdiction === "ch" ? "Switzerland" : "the EU";
  const note = oos ? `<div class="oosnote">Outside your territorial scope — does not bind ${jurLabel} directly (shown for reference)</div>` : "";
  const hasRich = !!RICH[id];
  const richUi = hasRich
    ? `<button class="rcbtn" data-card="${id}">Read full card &#9656;</button><div class="richbox" id="rc-${id}" style="display:none"></div>`
    : "";
  return `<div class="reg${oos ? " oos" : ""}">
    <div><span class="rt">${esc(r.title)}</span><span class="rj">${esc(r.jurisdiction)}</span></div>
    ${note}
    <p class="rs">${esc(r.summary)}</p>
    ${arts ? `<div class="ra">${esc(arts)}</div>` : ""}
    ${link}
    ${richUi}
  </div>`;
}

function renderPanel(){
  const regs = activeRegs();
  const inS = regs.filter(inScope), oos = regs.filter(id => !inScope(id));
  const panel = document.getElementById("panel");
  const sub = oos.length ? ` <span class="oossub">+ ${oos.length} out-of-scope (greyed)</span>` : "";
  panel.innerHTML = `<h2>Applicable regulations</h2>
    <div class="count">${inS.length} card${inS.length===1?"":"s"} triggered${sub}</div>
    ${regs.length ? regs.map(regCard).join("") : '<p class="empty">None yet — answer the questions and cards will stack here.</p>'}`;
}

function answeredCount(){ return state.history.length; }
function totalQuestions(){ return TREE.questions.length; }

function answerTag(a){
  const adds = (a.adds||[]).map(id => (REG[id]?REG[id].title.split(" —")[0].split(" (")[0]:id));
  return adds.length ? `<span class="tag">+ ${esc(adds.join(", "))}</span>` : "";
}

function renderQuestion(){
  const q = Q[state.current];
  const stage = document.getElementById("stage");
  const pct = Math.round(100 * answeredCount() / totalQuestions());
  const isGate = q.type === "gate";
  const multi = q.multiSelect === true;
  const meta = isGate ? " · gate" : (multi ? " · choose all that apply" : (q.type==="multichoice" ? " · choose one" : ""));
  state.multiSel = new Set();
  stage.innerHTML = `
    <div class="progress">
      <span>${answeredCount()} / ${totalQuestions()}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      <span>${q.id}${isGate ? " · gate" : ""}</span>
    </div>
    <div class="qmeta">${esc(q.id)}${meta}</div>
    <div class="qtext">${esc(q.text)}</div>
    ${q.rationale ? `<p class="qrat">${esc(q.rationale)}</p>` : ""}
    ${multi ? `<p class="multihint">Tick every market/option that applies, then continue.</p>` : ""}
    <div class="answers">
      ${q.answers.map((a,i) =>
        `<button class="ans" data-i="${i}">${multi ? '<span class="chk">&#10003;</span>' : ""}<span>${esc(a.label)}</span>${answerTag(a)}</button>`
      ).join("")}
    </div>
    ${multi ? `<button class="continue" id="continue">Continue &rarr;</button>` : ""}
    <div class="nav">
      <button id="back" ${state.history.length?"":"disabled"}>&larr; Back</button>
      <button id="restart2">Restart</button>
    </div>`;
  if (multi){
    stage.querySelectorAll("button.ans").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (state.multiSel.has(i)) state.multiSel.delete(i); else state.multiSel.add(i);
      b.classList.toggle("sel");
    });
    document.getElementById("continue").onclick = () => chooseMulti();
  } else {
    stage.querySelectorAll("button.ans").forEach(b => b.onclick = () => choose(+b.dataset.i));
  }
  document.getElementById("back").onclick = goBack;
  document.getElementById("restart2").onclick = restart;
}

function renderExit(){
  const e = X[state.current];
  const stage = document.getElementById("stage");
  const regs = activeRegs();
  const inS = regs.filter(inScope), oos = regs.filter(id => !inScope(id));
  let body = "";
  if (e.type === "recap"){
    if (!regs.length){
      body = `<p class="empty">No regulation was triggered along this path.</p>`;
    } else {
      body = `<div class="grid">${inS.map(regCard).join("")}</div>`;
      if (oos.length){
        body += `<p class="sub" style="margin-top:22px">Triggered but outside your territorial scope (${oos.length}) — shown for reference:</p>`;
        body += `<div class="grid">${oos.map(regCard).join("")}</div>`;
      }
    }
  }
  const crumbs = state.history.map(h => `<b>${esc(Q[h.node]?h.node:h.node)}</b> ${esc(h.answerLabel)}`).join("  ·  ");
  stage.innerHTML = `
    <div class="recap">
      <span class="pill">${e.type === "recap" ? "Summary" : "Exit"}</span>
      <h2>${esc(e.title)}</h2>
      <p class="sub">${esc(e.summary)}</p>
      ${e.type === "recap" ? `<p class="sub"><strong>${inS.length}</strong> regulation${inS.length===1?"":"s"} apply to your app${oos.length?` (+ ${oos.length} EU-only, not binding for your jurisdiction)`:""}.</p>` : ""}
      ${body}
      <div class="nav"><button id="back">&larr; Back</button></div>
      <br/><button class="restart" id="restart3">Start over</button>
      <div class="breadcrumb">${crumbs}</div>
    </div>`;
  document.getElementById("back").onclick = goBack;
  document.getElementById("restart3").onclick = restart;
}

function draw(){
  if (Q[state.current]) renderQuestion();
  else renderExit();
  renderPanel();
}

function commitStep(node, answerLabel, addedIds, next){
  if (node === TREE.start){
    // capture jurisdiction from the Q1 answer value
    const q = Q[node];
    const ans = q.answers.find(a => a.label === answerLabel.split(" + ")[0]) || q.answers[0];
    state.jurisdiction = ans ? ans.value : null;
  }
  state.history.push({ node, answerLabel, addedIds, setJurisdiction: node === TREE.start });
  state.added.push(...addedIds);
  state.current = next;
  draw();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function choose(i){
  const q = Q[state.current];
  const a = q.answers[i];
  commitStep(state.current, a.label, (a.adds||[]).slice(), a.next);
}

function chooseMulti(){
  const q = Q[state.current];
  const picked = [...state.multiSel].sort((x,y)=>x-y).map(i => q.answers[i]);
  const sel = picked.length ? picked : [q.answers[q.answers.length-1]]; // none ticked = last ("No") option
  const addedIds = [].concat(...sel.map(a => (a.adds||[]).slice()));
  const label = sel.map(a => a.label).join(" + ");
  const next = sel[0].next; // all options of a multi-select question share the same next
  commitStep(state.current, label, addedIds, next);
}

function goBack(){
  const last = state.history.pop();
  if (!last) return;
  // remove the regs that this step added
  for (const id of last.addedIds){
    const idx = state.added.lastIndexOf(id);
    if (idx !== -1) state.added.splice(idx, 1);
  }
  if (last.setJurisdiction) state.jurisdiction = null;
  state.current = last.node;
  draw();
}

function restart(){
  state = { current: TREE.start, history: [], added: [], jurisdiction: null };
  draw();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

draw();
</script>
