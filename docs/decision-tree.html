 trust** · **Biometric / sensitive-data interplay**\n- Cross-links: [[ai_act_timeline]], [[gdpr_biometric]], [[ai_act_high_risk]]\n\n## Official sources\n- EUR-Lex — AI Act, Art. 50 (OJ L of 12 Jul 2024): https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202401689\n- European Commission — Code of Practice on marking AI-generated content: https://digital-strategy.ec.europa.eu/en/policies/code-practice-ai-generated-content\n", "ch_rep_meddo": "# MedDO — MDR third country & Swiss authorised representative (CH-REP)\n\n## Why this concerns you (purpose)\nMost teams assume that holding a **CE mark** lets them sell into Switzerland. It does not, on\nits own. Because the **EU–Switzerland Mutual Recognition Agreement (MRA) was never updated**\nfor the MDR, **Switzerland has been a third country for the MDR since 26 May 2021**. The direct\nconsequence: any manufacturer **without a registered seat in Switzerland — including EU/EEA\nmanufacturers** — must appoint a **Swiss authorised representative (CH-REP)** before placing a\ndevice on the Swiss market. The relationship is **symmetric**: a Swiss manufacturer needs an\n**EU authorised representative (EU-REP)** to sell into the EU. And because Switzerland is a third\ncountry, **Swissmedic has no access to EUDAMED** — registration happens in the Swiss system.\n\n## When it is triggered (scope)\nTriggered as soon as **all** of the following hold:\n- your product is (or could be) a **medical device / SaMD** under MedDO ([[swiss_stack]]);\n- it is **placed on the Swiss market**;\n- your manufacturer's **registered seat is outside Switzerland** (EU/EEA included).\n\nThe transition periods that once staggered the CH-REP obligation by risk class have **lapsed**,\nso the requirement now applies across classes. The mirror case — a **Swiss-seated** manufacturer\nselling into the EU — triggers the **EU-REP** requirement instead.\n\n## Concrete obligations\n- Appoint a **CH-REP** under **Art. 51(1) MedDO** with a written mandate; the CH-REP carries the\n  formal and safety-related responsibilities of placing the device on the Swiss market.\n- Put the CH-REP **name and address on the device/labelling** (the symbol or the wording\n  \"CH-REP\" / \"CH authorised representative\"); a P.O. box, e-mail or phone number alone is **not** sufficient.\n- **Register** the actors and the device in the Swiss database (**swissdamed**) and obtain the\n  Swiss registration number (**CHRN**) — you cannot rely on an EUDAMED registration.\n- For a Swiss manufacturer targeting the EU, appoint an **EU-REP** symmetrically (MDR Art. 11).\n- Keep EU EUDAMED and Swiss swissdamed registrations **separate** — they do not interoperate;\n  see [[udi_eudamed]] for the EU side.\n\n## Checklist\n- [ ] Determine your manufacturer's registered seat (in CH vs outside CH).\n- [ ] If outside CH, sign a CH-REP mandate (Art. 51(1) MedDO) before any Swiss placement.\n- [ ] Add the CH-REP name + address to labelling/IFU; register in **swissdamed** and obtain the CHRN.\n- [ ] If Swiss-seated and selling into the EU, appoint an EU-REP and register in EUDAMED ([[udi_eudamed]]).\n- [ ] Do not treat an EUDAMED entry as covering Switzerland — Swissmedic cannot see it.\n\n## Examples (mHealth)\n- A French Class IIa SaMD publisher selling in Switzerland → needs a **CH-REP** and a swissdamed/CHRN\n  registration, even though it is fully MDR-compliant and EUDAMED-registered in the EU.\n- A **Zurich-based** SaMD startup selling into Germany → needs an **EU-REP** (mirror obligation), not a CH-REP.\n- A US wellness-only app with **no medical-device claim** and no Swiss device placement → **no CH-REP**\n  needed under MedDO (the obligation attaches to medical devices, not to every app).\n\n## HERA dimensions touched\n- **Swiss market access** · **Economic operators / representation** · **Device registration**\n- Cross-links: [[swiss_stack]], [[udi_eudamed]]\n\n## Official sources\n- Swissmedic — Swiss authorised representative (CH-REP): https://www.swissmedic.ch/swissmedic/en/home/medical-devices/market-access/ch-rep.html\n- Swissmedic — Registering economic operators (CHRN): https://www.swissmedic.ch/swissmedic/en/home/medical-devices/market-access/registriernummer-chrn.html\n- Fedlex — MedDO / Medical Devices Ordinance (SR 812.213): https://www.fedlex.admin.ch/eli/cc/2020/552/en\n", "clinical_eval_mdsw": "# Clinical evaluation of software (MDR Art. 61 / MDCG 2020-1)\n\n## Why this concerns you (purpose)\nIf your software is a classified medical device (SaMD), CE marking is not granted on\nthe basis that the code \"works\". You must show, with **clinical evidence**, that the\ndevice actually delivers a **clinical benefit** and is **safe** for its intended\npurpose. For software this is not a literature search bolted on at the end — MDCG\n2020-1 lays out a **three-pillar model** that you must satisfy and keep current\nthroughout the product's life.\n\n## When it is triggered (scope)\nTriggered when your product is qualified as **medical device software** and\nclassified (>= MDR Class IIa, or an IVD-MDSW under the IVDR). A clinical evaluation\nunder **MDR Art. 61 + Annex XIV** is required for every such SaMD; the depth scales\nwith the risk class ([[mdr_class_iib]]). For **Class III and implantable** devices a\n**clinical investigation** is the default route (Annex XV, **EN ISO 14155**). Pure\nwellness software with no medical purpose is out of scope.\n\n## Concrete obligations\n- Build clinical evidence around the **three pillars** of MDCG 2020-1:\n  1. **Valid clinical association / scientific validity** — the output is\n     meaningfully linked to the targeted clinical condition or physiological state;\n  2. **Technical / analytical performance** — the software correctly and reliably\n     generates the intended output from the input data (verification & validation);\n  3. **Clinical performance** — the output yields a clinically relevant, accurate and\n     reliable result in the intended use, population and clinical setting.\n- Document it in a **Clinical Evaluation Plan** and **Clinical Evaluation Report\n  (CER)**, with state-of-the-art and benefit-risk analysis (Annex XIV Part A).\n- For **Class III / implantable** SaMD, conduct a **clinical investigation** per\n  Annex XV / EN ISO 14155 unless a documented exemption applies.\n- **Keep it living**: update the CER from post-market clinical follow-up (PMCF)\n  data over the lifecycle ([[pms_lifecycle]]).\n\n## Checklist\n- [ ] Confirm scientific validity (literature / state-of-the-art for the clinical claim).\n- [ ] Verify and validate technical/analytical performance (algorithm correctness, data quality).\n- [ ] Demonstrate clinical performance in the intended population and use setting.\n- [ ] Write the Clinical Evaluation Plan and CER; link PMCF as a feedback loop.\n- [ ] For Class III/implantable, plan a clinical investigation (Annex XV / EN ISO 14155).\n\n## Examples (mHealth)\n- A Class IIa app scoring melanoma risk from skin photos -> needs all three pillars:\n  the score correlates with malignancy (validity), the model runs correctly on real\n  images (analytical), and it performs in the target population (clinical).\n- A Class IIb insulin-dosing decision-support SaMD -> deeper clinical performance\n  evidence and a robust PMCF plan ([[mdr_class_iib]]).\n- A meditation/relaxation app making **no medical claim** -> not a SaMD, so no MDR\n  clinical evaluation is required (it sits under health-software quality standards\n  instead).\n\n## HERA dimensions touched\n- **Clinical evidence** · **Conformity assessment** · **Lifecycle evidence**\n- Cross-links: [[mdr_class_iib]] (depth by class), [[pms_lifecycle]] (PMCF keeps the CER live), [[samd_standards]] (V&V via IEC 62304)\n\n## Official sources\n- MDCG 2020-1 — Clinical/performance evaluation of medical device software: https://health.ec.europa.eu/system/files/2020-09/md_mdcg_2020_1_guidance_clinic_eva_md_software_en_0.pdf\n- EUR-Lex — MDR (Regulation (EU) 2017/745), Art. 61 / Annex XIV-XV: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02017R0745-20230320\n", "combination_product": "# Combination products device + medicine (MDR Art. 1(8)/1(9), Art. 117)\n\n## Why this concerns you (purpose)\nWhen your app or device sits next to a **medicinal product** — a companion app that\nsets a dose or drives adherence, or a device that incorporates or administers a drug\n— you are in **borderline territory** between two legal worlds: the MDR and the\nmedicines framework (Dir. 2001/83/EC). Getting the qualification wrong means filing\nunder the wrong regulator entirely. The deciding test is the **principal mode of\naction**, and MDCG 2022-5 is the map.\n\n## When it is triggered (scope)\nTriggered when your product **combines a device function with a medicinal substance\nor product**, e.g.:\n- a device that **incorporates** a medicinal substance (Art. 1(8)); or\n- a device **intended to administer** a medicinal product (Art. 1(9)); or\n- a **drug-companion app** for dosing, titration or adherence tied to a specific\n  medicine.\n\nIf the software simply records symptoms with no link to a medicine, this card does\nnot apply ([[clinical_eval_mdsw]]).\n\n## Concrete obligations\n- Determine the **principal mode of action** (PMOA) per MDCG 2022-5:\n  - substance has an **ancillary** action to the device -> regulated as a **medical\n    device under the MDR** (the substance is assessed within the device dossier);\n  - substance has the **principal** action -> regulated as a **medicinal product**\n    (Dir. 2001/83/EC), and the device component must still meet the relevant MDR\n    Annex I General Safety and Performance Requirements (GSPR).\n- Where a device is part of a medicinal product's marketing-authorisation dossier\n  (e.g. a device administering the drug), obtain a **notified body opinion (NBOp)**\n  on the device part under **MDR Art. 117** before/with the MA application.\n- For a **drug-companion app**, decide whether it is a **standalone SaMD** (its own\n  CE route + clinical evaluation) or **part of the medicine's labelling/MA** — and\n  document the rationale.\n- Consult the relevant **medicines authority** where the qualification is unclear.\n\n## Checklist\n- [ ] State the product's principal mode of action and the resulting regime (MDR vs medicine).\n- [ ] If a device is in an MA dossier, secure the Art. 117 notified-body opinion.\n- [ ] For a companion app, classify it as standalone SaMD or part of the MA, with justification.\n- [ ] Ensure the device component meets MDR Annex I GSPR even under the medicines regime.\n- [ ] Document the borderline analysis against MDCG 2022-5 rev.1.\n\n## Examples (mHealth)\n- An app that **calculates an insulin dose** specific to a branded insulin and is\n  required for safe use of that medicine -> likely tied to the medicinal product's\n  MA; assess under the medicines framework (with device GSPR for the app).\n- A **standalone** dose-tracking app usable across many drugs, providing decision\n  support -> qualifies as a SaMD under the MDR with its own clinical evaluation\n  ([[clinical_eval_mdsw]]).\n- A **simple pill-reminder** app with no dose calculation and no medical claim ->\n  **not** a combination product and not a medical device at all.\n\n## HERA dimensions touched\n- **Product qualification (borderline)** · **Regulator routing** · **Conformity assessment**\n- Cross-links: [[clinical_eval_mdsw]] (if it qualifies as standalone SaMD), [[mdr_class_iib]] (risk class if MDR), [[pms_lifecycle]] (post-market duties either way)\n\n## Official sources\n- MDCG 2022-5 rev.1 — Borderline between medical devices and medicinal products under MDR: https://health.ec.europa.eu/system/files/2023-06/mdcg_2022-5_en.pdf\n- EUR-Lex — MDR (Regulation (EU) 2017/745), Art. 1(8)/1(9), Art. 117: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02017R0745-20230320\n", "cra": "# CRA — Cyber Resilience Act (products with digital elements)\n\n## Why this concerns you (purpose)\nIf you place a mHealth **app or software** on the EU market, the Cyber Resilience\nAct (Reg. (EU) 2024/2847) treats it as a **\"product with digital elements\"** that\nmust be **secure by design and by default** for its whole supported lifetime. The\npoint is product security, not paperwork: you must ship without known exploitable\nvulnerabilities, handle vulnerabilities as they appear, and keep users patched. The\nCRA is **distinct from NIS2** — NIS2 governs how your *organisation* manages cyber\nrisk; the CRA governs the *product* you sell. A SaMD already CE-marked under the MDR\nis not automatically off the hook: the cybersecurity essential requirements still\nhave to be met (in practice via the MDR route, see [[nis2_cyber]] and MDR Annex I §17).\n\n## When it is triggered (scope)\nTriggered when **all** of the following hold:\n- you make available on the EU market a **software or hardware product with digital\n  elements** (a mobile app, a connected-device firmware, a SaMD backend, an SDK);\n- it can be **connected** (directly or indirectly) to a device or network;\n- it is supplied in the **course of a commercial activity** (free + paid both count;\n  pure open-source not monetised is largely carved out).\n\nEdge: a service you run purely as a SaaS backend without distributing the software is\ncloser to NIS2 than CRA — but any component you *ship* (mobile app, on-device model)\nis in CRA scope.\n\n## Concrete obligations\n- Design, develop and produce the product to meet the **essential cybersecurity\n  requirements** of Annex I (no known exploitable vulnerabilities at release,\n  secure default config, confidentiality/integrity protection, minimal attack surface).\n- Run a **vulnerability-handling process** for the whole support period: maintain a\n  **Software Bill of Materials (SBOM)** (Annex I Part II / Annex II), provide\n  **free security updates**, and have a coordinated disclosure policy.\n- **Report actively exploited vulnerabilities and severe incidents** to ENISA (single\n  reporting platform) and the relevant CSIRT — early warning within **24h**, then\n  staged updates — **from 11 Sep 2026**.\n- Carry out conformity assessment, draw up technical documentation + EU Declaration of\n  Conformity, and affix the **CE marking** — **full obligations from 11 Dec 2027**.\n\n## Checklist\n- [ ] Maintain an up-to-date SBOM for every shipped component and third-party dependency.\n- [ ] Stand up a vulnerability-handling + coordinated-disclosure process and a security-update channel.\n- [ ] Define and publish the **support period** during which you will issue free security updates.\n- [ ] Wire up ENISA / CSIRT reporting before **11 Sep 2026**; plan CE conformity for **11 Dec 2027**.\n\n## Examples (mHealth)\n- A symptom-tracker app distributed via the App Store → product with digital elements;\n  needs SBOM, secure defaults, update channel, CE marking by Dec 2027.\n- A glucometer companion app whose Bluetooth pairing is found to be exploitable and is\n  being attacked in the wild → must report to ENISA/CSIRT (early warning 24h) once the\n  24-month reporting regime is live.\n- A purely internal analytics dashboard never distributed outside your company →\n  outside CRA scope (no product made available on the market), though NIS2 may still apply.\n\n## HERA dimensions touched\n- **Product cybersecurity** · **Vulnerability management / SBOM** · **EU market access (CE)**\n- Cross-links: [[nis2_cyber]] (organisation vs product), [[pld]] (a missing security update can be a defect)\n\n## Official sources\n- EUR-Lex — Regulation (EU) 2024/2847: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R2847\n- European Commission — Cyber Resilience Act: https://digital-strategy.ec.europa.eu/en/policies/cyber-resilience-act\n", "data_act": "# Data Act — access & portability of connected-product data\n\n## Why this concerns you (purpose)\nIf your mHealth offering pairs with a **connected product** (a wearable, a glucometer,\na smart scale, a sensor), the Data Act (Reg. (EU) 2023/2854) gives the **user** a right\nto the data that product generates — to access it, to use it, and to have it ported to a\n**third party of their choice**. You can no longer treat sensor data as a locked-in\nproprietary asset. The Act also targets **cloud lock-in**: if you sell a data-processing\nservice, customers must be able to switch providers. The Data Act has been **applicable\nsince 12 September 2025**. It is a *data-economy* rule and works **alongside the GDPR**:\nwhere the data is personal health data, GDPR (Art. 9) and the Data Act both apply.\n\n## When it is triggered (scope)\nTriggered when **any** of the following hold:\n- you place on the EU market a **connected product** (IoT device/wearable) or a\n  **related service** that generates usage/performance/environment data;\n- you are a **data holder** controlling access to that connected-product data;\n- you provide a **data-processing service** (cloud/edge) to EU customers (switching rules).\n\nEdge: a **standalone app** with no connected object and no cloud service offered to\ncustomers is largely out of the connected-product obligations (though the cloud-switching\nchapter can still reach the services you buy).\n\n## Concrete obligations\n- **Access by design / by default**: where feasible, the connected product and related\n  service should make data directly accessible to the user (Art. 3-4).\n- **Pre-contractual information**: tell users, before they buy, what data is generated,\n  how to access it, and whether you (the holder) intend to use it.\n- **Sharing on FRAND terms**: on the user's request, share data with a third party on\n  **fair, reasonable and non-discriminatory** terms; protect trade secrets proportionately;\n  do not use shared data to compete against the connected product.\n- **Cloud anti-lock-in / switching** (Chapter VI): contractual + technical portability,\n  removal of switching obstacles; **switching charges abolished from 12 January 2027**.\n\n## Checklist\n- [ ] Map the data your connected product/wearable generates and design a user-access path.\n- [ ] Add Data Act **pre-contractual disclosures** to your terms (what data, how to get it, FRAND).\n- [ ] Build a third-party data-portability flow and FRAND sharing terms (with trade-secret safeguards).\n- [ ] If you resell or rely on cloud, check switching/exit terms and the **Jan 2027** fee phase-out.\n\n## Examples (mHealth)\n- A continuous glucose monitor + app: the patient can require their raw glucose readings\n  be sent to a competing analytics service → you must enable FRAND portability.\n- A sleep-tracking ring whose vendor refuses to export historical heart-rate data →\n  non-compliant; the user has an access/portability right under the Data Act.\n- A purely manual food-diary app with no sensor and no cloud service sold to others →\n  the connected-product obligations are not triggered.\n\n## HERA dimensions touched\n- **Connected-device data rights** · **Data portability / FRAND** · **Cloud anti-lock-in**\n- Cross-links: [[gdpr_art9]] (personal health data overlay), [[ehds]] (health data sharing & interoperability)\n\n## Official sources\n- EUR-Lex — Regulation (EU) 2023/2854: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2854\n- EUR-Lex (PDF, OJ L 2023/2854): https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=OJ:L_202302854\n", "data_monetization": "# Data monetisation / third-party sharing\n\n## Why this concerns you (purpose)\nIf your mHealth business model relies on **advertising, selling aggregated data, or sharing\ndata with third parties**, you are processing health data for purposes *beyond* providing\ncare. Under GDPR this needs its **own lawful basis per purpose**, and for special-category\n(health) data that basis is essentially **explicit consent** (Art. 9(2)(a)). Bundling\nmonetisation consent into the \"accept to use the app\" flow is a classic failure mode that\nregulators treat as invalid consent — and as unlawful processing of sensitive data.\n\n## When it is triggered (scope)\nTriggered when health (or health-derived) data is used for any purpose other than the core\nrequested service, in particular:\n- **targeted advertising** or ad measurement;\n- **sale or licensing** of data (including \"aggregated\" or \"anonymised\" sets);\n- **sharing with third parties** (partners, brokers, model trainers).\n\nNote: data is only outside GDPR if it is **truly anonymous** (irreversible, per Recital 26 and\nWP29 Opinion 5/2014) — \"pseudonymised\" or weakly aggregated health data is still personal data.\nIf the monetisation also relies on device trackers/SDKs, **ePrivacy** consent is *additionally*\nrequired and is a *separate* obligation — see [[eprivacy_terminal]].\n\n## Concrete obligations\n- Obtain **explicit, granular, purpose-specific consent** (Art. 9(2)(a)) for each monetisation\n  purpose, **separate** from consent to use the app; make withdrawal as easy as giving it.\n- Provide **layered transparency** (Art. 13): name the recipients/categories, the purposes,\n  and any profiling logic; do not present monetisation as a condition of the service.\n- Put a **GDPR Art. 28 data-processing agreement** (or controller-to-controller terms) in place\n  with each recipient and verify their safeguards.\n- If you claim anonymisation, **document the technique and re-identification risk**; if it is\n  not irreversible, treat the data as personal/health data.\n- Layer **ePrivacy consent** for any tracker/SDK used to enable the monetisation.\n\n## Checklist\n- [ ] List every monetisation purpose and the third parties involved.\n- [ ] Build separate, granular explicit-consent toggles (not bundled, not pre-ticked).\n- [ ] Sign Art. 28 DPAs / sharing terms and verify recipient safeguards.\n- [ ] Justify and document any anonymisation claim against Recital 26 / WP29 Op. 5/2014.\n- [ ] Pair with ePrivacy consent for the underlying trackers — see [[eprivacy_terminal]].\n\n## Examples (mHealth)\n- A free fertility app **sharing cycle data with advertisers** → explicit, separate consent per\n  purpose; bundled \"agree to use the app\" consent is invalid.\n- A nutrition app selling a **\"de-identified\" food-and-symptom dataset** to a CPG brand → if\n  re-identification is feasible it remains health data and needs an Art. 9(2)(a) basis.\n- (Edge/negative) Producing **truly anonymous, aggregate population statistics** (no individual\n  re-identification possible) for internal benchmarking → outside GDPR; but you must be able to\n  evidence the irreversibility.\n\n## HERA dimensions touched\n- **Lawful basis (consent) & purpose limitation** · **Third-party sharing** · **Anonymisation**\n- Cross-links: [[eprivacy_terminal]], [[gdpr_art9]], [[gdpr_children]], [[gdpr_transfer]]\n\n## Official sources\n- EUR-Lex — GDPR (Art. 9, Recital 26): https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679\n- WP29 Opinion 05/2014 on anonymisation techniques (WP216): https://ec.europa.eu/justice/article-29/documentation/opinion-recommendation/files/2014/wp216_en.pdf\n", "diga_germany": "# DiGA (Germany) — fast-track reimbursement for digital health apps\n\n## Why this concerns you (purpose)\nDiGA (\"Digitale Gesundheitsanwendung\") is Germany's **fast-track** route to getting your\napp **prescribed and reimbursed by statutory health insurance (GKV)** — covering ~73M\ninsured people. It is the most mature digital-therapeutics reimbursement scheme in\nEurope. CE marking only lets you *sell*; DiGA listing in the **BfArM directory** is what\nmakes a doctor able to prescribe your app and a sickness fund obliged to pay. The bar is\nspecific: a medical-device class, a demonstrated **positive care effect**, and certified\n**security + interoperability**.\n\n## When it is triggered (scope)\nRelevant when you seek **GKV reimbursement in Germany** for a digital app that is:\n- a **CE-marked medical device, class I or IIa** — and, since the **DigiG / DiGAV\n  reform (phasing in from 2026)**, **certain low-risk class IIb** devices too;\n- with a **primary digital function** supporting the detection, monitoring, treatment or\n  alleviation of disease (a \"low-risk\" digital health application under **§139e SGB V**).\n\nIt is **not** for hardware-centric devices, pure wellness apps (no medical purpose), or\nclass IIb/III above the low-risk cut-off. A drug-companion or high-risk diagnostic SaMD\ntypically falls outside DiGA and follows the ordinary MDR + reimbursement route.\n\n## Concrete obligations\n- **Device class**: hold a CE certificate as class I/IIa (or low-risk IIb, phasing in\n  from 2026 under the DigiG/DiGAV reform). See [[mdr_class_iia]].\n- **Positive care effect (positiver Versorgungseffekt)**: either a **medical benefit** or\n  a **patient-relevant improvement of structure/processes**, evidenced by a comparative\n  study (RCT preferred) — required for permanent listing.\n- **Security**: **BSI TR-03161** certification is **mandatory since 2025-01-01** (a\n  dedicated security assessment of mobile app, web app and backend, beyond the old\n  self-declaration).\n- **Interoperability**: support **ePA** (electronic patient record), **GesundheitsID**\n  (insured identity) and the **INA** interoperability requirements; data protection per\n  GDPR + national rules.\n- **Provisional vs permanent**: a **provisional listing of 12 months** (extendable to 24)\n  to generate evidence, then permanent listing on proven positive care effect.\n- **From 2026**: mandatory **application-accompanying success measurement (AbEM)** with\n  periodic anonymised/aggregated reporting to BfArM (first submissions due 2027), and a\n  shift toward **success-dependent / outcome-based pricing**.\n\n## Checklist\n- [ ] Confirm your device class qualifies (I/IIa, or low-risk IIb from 2026 under the DigiG/DiGAV reform).\n- [ ] Obtain BSI TR-03161 certification (mandatory since 2025-01-01) for app + backend.\n- [ ] Plan the comparative study proving the positive care effect (medical or structural/process).\n- [ ] Implement ePA + GesundheitsID + INA interoperability requirements.\n- [ ] Prepare AbEM data collection and a success-dependent pricing model for the 2026 regime.\n\n## Examples (mHealth)\n- A CBT-based app for depression, CE class IIa, with an RCT showing symptom reduction →\n  strong DiGA candidate: provisional listing → permanent on the positive care effect.\n- A tinnitus therapy app starts with a **12-month provisional** listing while it runs the\n  trial, then must show the effect to stay listed — and from 2026 reports AbEM data.\n- A **wellness step-counter** with no medical purpose, or a high-risk class IIb diagnostic\n  above the low-risk cut-off → **not eligible** for DiGA; pursue another route.\n\n## HERA dimensions touched\n- **German market access / GKV reimbursement** · **Medical-device classification** · **Security certification (BSI)** · **Interoperability (ePA/GesundheitsID)** · **Clinical evidence**\n- Cross-links: [[mdr_class_iia]] (device class prerequisite), [[reimbursement_other_eu]] (parallel national schemes), [[national_ehealth]] (ePA interoperability), [[eidas2]] (digital identity)\n\n## Official sources\n- BfArM — Digital Health Applications (DiGA): https://www.bfarm.de/EN/Medical-devices/Tasks/DiGA-and-DiPA/Digital-Health-Applications/_node.html\n- BSI — Technical Guideline TR-03161 (security requirements for digital health apps): https://www.bsi.bund.de/EN/Themen/Unternehmen-und-Organisationen/Standards-und-Zertifizierung/Technische-Richtlinien/TR-nach-Thema-sortiert/tr03161/tr03161_node.html\n", "eaa_accessibility": "# European Accessibility Act (EAA)\n\n## Why this concerns you (purpose)\nThe European Accessibility Act (Dir. (EU) 2019/882) requires that **consumer-facing\ndigital products and services** be usable by people with disabilities. For mHealth,\nthat means your **B2C app, its website and its purchasing/onboarding flows** must be\naccessible — perceivable, operable, understandable and robust — to users who rely on\nscreen readers, high contrast, captions, or alternative input. The obligations have\n**applied since 28 June 2025**. The practical benchmark is the harmonised standard\n**EN 301 549**, which incorporates **WCAG 2.1 Level AA** for web content and extends it\nto mobile apps and software: conforming to it gives a **presumption of compliance**.\nThis is a market-access and non-discrimination requirement, separate from any medical or\ndata-protection rules — but it sits on top of them for any patient-facing service.\n\n## When it is triggered (scope)\nTriggered when **all** of the following hold:\n- your service/product is **consumer-facing (B2C)** and aimed at the general public;\n- it falls in a **covered category** — e-commerce, consumer banking, e-readers,\n  telecoms, ticketing, and **consumer-facing software/websites/mobile apps** generally;\n- you place it on the **EU market** and are **not** an exempt microenterprise providing\n  services (under 10 staff and ≤ €2M turnover have limited service exemptions).\n\nEdge: a **strictly B2B / professional** tool used only by clinicians in a hospital is\ngenerally outside the EAA's consumer scope (national public-sector web rules may still\napply).\n\n## Concrete obligations\n- Meet the EAA accessibility requirements for the **app, website and purchase journey**;\n  use **EN 301 549 / WCAG 2.1 AA** as the compliance benchmark.\n- Provide **accessibility information** (how the product meets the requirements) and keep\n  the supporting documentation.\n- Ensure assistive-technology compatibility: text alternatives, captions, keyboard/operable\n  navigation, sufficient contrast, no reliance on a single sensory channel.\n- Maintain accessibility through updates (it is an ongoing obligation, not a one-off audit).\n\n## Checklist\n- [ ] Confirm your service is consumer-facing and in scope (and whether the microenterprise carve-out applies).\n- [ ] Audit the app + website + checkout/onboarding against **WCAG 2.1 AA / EN 301 549**.\n- [ ] Fix and document accessibility (alt text, captions, contrast, keyboard navigation).\n- [ ] Build accessibility regression checks into your release process to keep conformance over time.\n\n## Examples (mHealth)\n- A direct-to-consumer mental-health app with a subscription checkout → in scope; must be\n  WCAG 2.1 AA accessible, including the payment/onboarding flow.\n- A consumer symptom-checker website whose results are images with no text alternative →\n  non-compliant for screen-reader users.\n- A SaMD dashboard sold only to hospitals for clinician use (pure B2B) → outside the\n  EAA's consumer scope, though good accessibility remains advisable.\n\n## HERA dimensions touched\n- **Digital accessibility (WCAG/EN 301 549)** · **Consumer (B2C) market access** · **Inclusive design**\n- Cross-links: [[ehds]] (accessible patient access to health data)\n\n## Official sources\n- EUR-Lex — Directive (EU) 2019/882: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019L0882\n- European Commission — European Accessibility Act: https://commission.europa.eu/strategy-and-policy/policies/justice-and-fundamental-rights/disability/union-equality-strategy-rights-persons-disabilities-2021-2030/european-accessibility-act_en\n", "ehds": "# EHDS — European Health Data Space\n\n## Why this concerns you (purpose)\nThe European Health Data Space (Reg. (EU) 2025/327, **in force since 26 March 2025**)\nbuilds a common EU framework for health data on **two legs**. **Primary use**: patients\nget cross-border access to and control over their electronic health records, and EHR\nsystems must support a common exchange format (**EEHRxF**) so data is portable between\nproviders and countries. **Secondary use**: health data can be reused for research,\ninnovation, policy and regulation, but only through **Health Data Access Bodies (HDABs)**\nthat grant permits and serve data in secure processing environments. If your mHealth app\nwrites to or reads from EHRs, or you want to make/obtain health data for research, EHDS\nshapes how. It dovetails with the **Data Governance Act** (Reg. (EU) 2022/868) on data\naltruism and intermediation. General application lands **26 March 2027**, with primary-use\ndata exchange phasing in from **26 March 2029**.\n\n## When it is triggered (scope)\nTriggered when **any** of the following hold:\n- you supply an **EHR system** or an app that interoperates with EHRs (primary use →\n  EEHRxF conformity, registration, possible self-certification regime for \"wellness\" apps\n  claiming interoperability with EHRs);\n- you are a **data holder** of electronic health data (you may have to make it available\n  for secondary use via an HDAB on request);\n- you are a **data user** seeking health data for research/innovation → you apply to an\n  **HDAB** for a data permit and work inside a secure processing environment.\n\nEdge: purely **primary-care delivery** that never touches the EEHRxF exchange or HDAB\npermits is governed by GDPR/national law, not yet by the EHDS technical obligations.\n\n## Concrete obligations\n- **Primary use**: support patient access/portability and the **EEHRxF** format; EHR\n  systems must meet essential requirements and undergo conformity assessment; \"wellness\"\n  apps claiming EHR interoperability fall under a labelling/self-certification scheme.\n- **Secondary use**: data holders make defined health-data categories available to HDABs;\n  data users obtain a **data permit**, process only inside the **secure processing\n  environment**, and may not re-identify individuals.\n- Respect **opt-out** mechanisms for secondary use as provided by national implementation.\n- Articulate with **DGA** (data altruism/intermediation) and with **GDPR Art. 9** as the\n  personal-data baseline (see [[gdpr_art9]]).\n\n## Checklist\n- [ ] Decide if you are a data holder, data user, or EHR/interoperable-app provider under EHDS.\n- [ ] If you touch EHRs: plan EEHRxF support, conformity assessment / wellness-app labelling.\n- [ ] For research data: route requests through a **Health Data Access Body** permit, not bilateral deals.\n- [ ] Track the phased dates (general application **26 Mar 2027**; primary-use exchange from **26 Mar 2029**).\n\n## Examples (mHealth)\n- A patient-portal app that imports a national patient summary → must support the EEHRxF\n  exchange format and the patient's primary-use access rights.\n- A research team wanting real-world data from your diabetes app → they apply to an HDAB\n  for a permit; you serve data into the secure processing environment, no re-identification.\n- An internal B2B analytics tool that never connects to EHRs and never feeds HDAB secondary\n  use → the EHDS technical/permit obligations are not triggered (GDPR still applies).\n\n## HERA dimensions touched\n- **Health-data interoperability (EEHRxF)** · **Secondary use / HDAB permits** · **Patient data control**\n- Cross-links: [[eidas2]] (identity & EAA attestations for access), [[gdpr_art9]] (personal-data baseline)\n\n## Official sources\n- European Commission — European Health Data Space: https://health.ec.europa.eu/ehealth-digital-health-and-care/european-health-data-space_en\n- EUR-Lex (ELI) — Regulation (EU) 2025/327: https://eur-lex.europa.eu/eli/reg/2025/327/oj/eng\n", "eidas2": "# eIDAS 2 — EU Digital Identity Wallet\n\n## Why this concerns you (purpose)\nIf your app needs to **strongly identify a patient or a healthcare professional** —\nbefore a teleconsultation, an e-prescription, or access to a medical record — eIDAS 2\nsets the EU-wide rails. Regulation **(EU) 2024/1183** (in force 20 May 2024) obliges\nevery Member State to offer an **EU Digital Identity Wallet (EUDI Wallet)** by **end\n2026**. For mHealth this matters two ways: (1) you may be able to **rely on** the wallet\nfor high-assurance identity instead of building your own KYC; (2) under the EHDS, health\nroles/credentials are issued **into** the wallet as Electronic Attestations of\nAttributes (EAA), which your app may need to **accept and verify**.\n\n## When it is triggered (scope)\nRelevant when your app performs **strong identity proofing / authentication** of:\n- **patients** (e.g. to grant access to their record, enroll in télésurveillance);\n- **healthcare professionals** (e.g. to authorise prescribing or signing a care act).\n\nIt is **not** mandatory for a B2C wellness app that needs no high-assurance identity.\nAnd note: eIDAS 2 binds **EU/EEA** Member States — **Switzerland is out of scope**\n(it runs its own e-ID, federal Act adopted 2024, planned 2026), so a Swiss-only app does\nnot inherit the EUDI Wallet obligations.\n\n## Concrete obligations\n- **Member States** must provide at least one **EUDI Wallet** by end 2026 (24 months\n  after the implementing acts; the first technical/certification implementing\n  regulations were adopted in 2024-2025). You as a service provider do not issue it.\n- **Relying-party** duties: if you accept the wallet, register as a relying party,\n  request only the **attributes strictly necessary** (data minimisation), and verify\n  EAAs against their authentic source.\n- **Health attributes as EAA**: under the **EHDS** identity-management implementing\n  rules, Member States issue **HCP** (and relevant patient) attributes as EAAs into the\n  wallet, and healthcare providers must be able to **accept** them. Design your app to\n  consume **qualified/non-qualified EAAs** for role-based authorisation.\n- Use the wallet's **qualified electronic signature/seal** capability where a signed\n  clinical act is required (couples well with [[telehealth_national]] act traceability).\n\n## Checklist\n- [ ] Decide whether your app is a relying party (consumes the wallet) and register as such.\n- [ ] Request only strictly necessary attributes; document the data-minimisation rationale (GDPR).\n- [ ] Implement verification of EAAs (incl. EHDS health/HCP attributes) against authentic sources.\n- [ ] Support qualified e-signature/seal via the wallet for signed clinical acts where needed.\n- [ ] Track national rollout dates (wallet availability per Member State by end 2026).\n\n## Examples (mHealth)\n- A teleconsultation platform lets a doctor authenticate with the EUDI Wallet and present\n  an **HCP EAA** → app verifies the role attribute, then authorises e-prescribing.\n- A patient unlocks access to their national record via the wallet → high-assurance\n  identity reused instead of bespoke KYC, with consent and minimised attributes.\n- A **Swiss-only** mood-tracking app with simple email login → eIDAS 2 does **not** apply\n  (Switzerland not bound; the Swiss e-ID regime governs instead).\n\n## HERA dimensions touched\n- **Strong identity & authentication** · **Trust services / e-signature** · **Cross-border interoperability** · **Data minimisation (GDPR)**\n- Cross-links: [[ehds]] (health attributes issued as EAA), [[telehealth_national]] (HCP/patient identification for the act), [[national_ehealth]] (record access identity)\n\n## Official sources\n- EUR-Lex — Regulation (EU) 2024/1183 (eIDAS 2): https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1183\n- European Commission — EU Digital Identity Wallet: https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/915931811/The+European+Digital+Identity+Regulation\n", "eprivacy_terminal": "# ePrivacy Art. 5(3) — access to terminal equipment (cookies, SDKs, trackers)\n\n## Why this concerns you (purpose)\nArticle 5(3) of the ePrivacy Directive requires **prior consent** before *any* storing of\ninformation on, or reading of information from, a user's device — unless an exemption applies.\nThis is a **separate obligation from the GDPR**: it is about the *act of accessing the device*,\nnot about whether the data is personal. The EDPB's **Guidelines 2/2023 (final v2.0, 16 Oct\n2024)** confirm a deliberately **broad** technical reading, so most mHealth apps that embed\nany third-party tooling are caught — even before any \"data\" question arises.\n\n## When it is triggered (scope)\nTriggered whenever your app **stores or gains access to information** on the user's terminal\n(phone, watch, IoT device). Per Guidelines 2/2023, this covers far more than cookies:\n- **mobile SDKs** (analytics, crash reporting, attribution, ads),\n- **tracking pixels** and URL tracking,\n- **device fingerprinting** and unique identifiers,\n- locally-generated data collected via an API, and on-device hashed identifiers,\n- IoT / connected-device read-write.\n\nIt applies **regardless of monetisation** and **even for non-health data**. The narrow\n**exemptions** are: access *strictly necessary* to carry out the transmission, or *strictly\nnecessary* to provide a service **the user explicitly requested**. Analytics, attribution,\ncrash reporting and advertising are **not** strictly necessary, so they need consent.\n\n## Concrete obligations\n- Obtain **prior, GDPR-standard consent** (freely given, specific, informed, unambiguous,\n  as easy to refuse as to accept) **before** any non-exempt SDK/pixel/identifier fires.\n- **Block non-essential trackers until consent** — no pre-ticked boxes, no firing on app open.\n- Maintain an **inventory** of every SDK and tracker, its purpose, and its exemption status.\n- Keep this **distinct from your monetisation analysis** ([[data_monetization]]): ePrivacy can\n  apply even when you do not sell or share data; monetisation adds further GDPR-consent layers.\n\n## Checklist\n- [ ] Inventory every SDK, pixel, identifier and on-device read/write in the app.\n- [ ] Classify each as strictly-necessary (exempt) or consent-required.\n- [ ] Implement a consent gate that suppresses non-essential trackers until opt-in.\n- [ ] Ensure \"reject all\" is as prominent and easy as \"accept all\".\n- [ ] Re-audit after each SDK/dependency update and log consent records.\n\n## Examples (mHealth)\n- A symptom-tracker embedding a **Firebase/analytics or crash-reporting SDK** that sets a\n  device identifier on launch → Art. 5(3) consent required before it initialises.\n- A meditation app using a **marketing-attribution SDK / advertising pixel** → consent\n  required, *plus* monetisation consent — see [[data_monetization]].\n- (Edge/negative) Storing a **session token strictly necessary** to keep the user logged into\n  the service they requested → exempt from consent (still inform under GDPR transparency).\n\n## HERA dimensions touched\n- **Tracking & consent UX** · **Third-party SDK governance** · **Device-level privacy**\n- Cross-links: [[data_monetization]], [[gdpr_children]], [[data_act]], [[gdpr_dpia]]\n\n## Official sources\n- EDPB — Guidelines 2/2023 (page): https://www.edpb.europa.eu/our-work-tools/our-documents/guidelines/guidelines-22023-technical-scope-art-53-eprivacy-directive_en\n- EDPB — Guidelines 2/2023 final v2.0 (PDF): https://www.edpb.europa.eu/system/files/2024-10/edpb_guidelines_202302_technical_scope_art_53_eprivacydirective_v2_en_0.pdf\n", "gdpr_art9": "# GDPR Art. 9 — health data (special category)\n\n## Why this concerns you (purpose)\nHealth data is a **special category** under GDPR Art. 9(1) and its processing is\n**prohibited by default**. For an mHealth app this flips the usual logic: a normal Art. 6\nlegal basis is **not enough** — you must *additionally* clear one of the narrow Art. 9(2)\nexceptions before you may process symptoms, conditions, medication, biometrics, mental\nstate or any health-related behaviour. This is the rule that most distinguishes a health\napp from an ordinary one, and it routinely drags in a mandatory impact assessment\n([[gdpr_dpia]]). Treat Art. 9 as a gate that sits *on top of* the [[gdpr_base]] baseline.\n\n## When it is triggered (scope)\nTriggered as soon as you process **data concerning health** (Art. 4(15)) of EU/EEA users.\nThis is read **broadly**: it covers not just clinical records but anything from which a\nperson's health status can be **inferred** — wearable heart-rate and sleep data, mood/mental\nstate, menstrual or fertility tracking, medication adherence, even step counts when used to\ninfer a condition. **Genetic** and **biometric** data (when used to identify) are separate\nspecial categories under the same article — see [[gdpr_biometric]]. When in doubt, assume\nthe data is health data.\n\n## Concrete obligations\n- **Find an Art. 9(2) exception** — the practical ones for mHealth are:\n  - **(a) explicit consent** — the default for consumer apps; must be a clear affirmative\n    act that *specifically* references the health data and purpose (not bundled, not implied),\n    and freely withdrawable;\n  - **(h) healthcare / medical diagnosis / care** — usable when processing is done by or\n    under the responsibility of a health professional bound by confidentiality (Art. 9(3));\n  - **(i) public health**, **(c) vital interests** (emergencies), **(j) research** — narrower,\n    and (h)/(i)/(j) require a basis in EU or Member State law.\n- **Explicit consent done right:** separate, granular, opt-in per purpose; logged; as easy\n  to withdraw as to give. Reusing a generic \"I accept the terms\" tick-box is non-compliant.\n- **DPIA (Art. 35):** a Data Protection Impact Assessment is effectively required for\n  large-scale or systematic health-data processing — see [[gdpr_dpia]].\n- **Member State overlay:** Art. 9(4) lets states add stricter conditions for health/genetic/\n  biometric data (e.g. French health-data rules), so check the national layer too.\n\n## Checklist\n- [ ] Confirm an Art. 9(2) condition for **each** health-data purpose (usually 9(2)(a) consent or 9(2)(h) care).\n- [ ] Implement **explicit, granular, per-purpose** opt-in consent with easy withdrawal and an audit log.\n- [ ] Keep health-data purposes **separate** from marketing/analytics consents (no bundling).\n- [ ] Run a **DPIA** before launch for any large-scale or systematic health processing → [[gdpr_dpia]].\n- [ ] Check the **national** Art. 9(4) overlay for each target Member State.\n\n## Examples (mHealth)\n- A diabetes-logging app storing glucose readings and insulin doses → health data under\n  Art. 9; relies on **explicit consent (9(2)(a))** for the consumer version, plus a DPIA.\n- A teleconsultation platform where a doctor records a diagnosis → can rely on **9(2)(h)**\n  (care provided by a confidentiality-bound professional) instead of consent.\n- A \"fitness-only\" step counter that **infers and flags a likely cardiac condition** → even\n  though marketed as wellness, the *inference* makes it health data; the \"we're not health\"\n  disclaimer does **not** remove it from Art. 9 (edge/negative case).\n\n## HERA dimensions touched\n- **Special-category health data** · **Lawful basis & explicit consent** · **Impact assessment**\n- Cross-links: [[gdpr_base]] (the baseline Art. 9 sits on), [[gdpr_dpia]] (Art. 35 assessment), [[gdpr_biometric]] (genetic/biometric special categories), [[nlpd_base]] (Swiss \"sensitive data\" equivalent, Art. 5(c))\n\n## Official sources\n- EUR-Lex — Regulation (EU) 2016/679 (GDPR), Art. 9: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679\n- EDPB — guidelines on processing of special categories of data: https://www.edpb.europa.eu/our-work-tools/general-guidance/guidelines-recommendations-best-practices_en\n", "gdpr_automated": "# GDPR Art. 22 — automated decisions\n\n## Why this concerns you (purpose)\nIf your mHealth app makes a decision about a user **solely by automated means** that\nproduces **legal effects** or **similarly significantly affects** them (triage outcome,\ntreatment eligibility, insurance/risk scoring), GDPR Art. 22 gives the person the right\n**not to be subject** to it — unless a narrow exception applies *and* you put safeguards in\nplace. This is not just \"explain your algorithm\": it is a default prohibition with carve-outs.\n\n## When it is triggered (scope)\nTriggered when **all** of the following hold:\n- the decision is **based solely on automated processing** (including profiling); and\n- it produces **legal effects** or **similarly significant** effects on the individual.\n\n\"Solely\" is read broadly: per the CJEU **SCHUFA** ruling (C-634/21, 7 Dec 2023), a score\nthat a downstream actor predictably relies on counts as the decision, and a human who merely\n**rubber-stamps** the algorithm does *not* take it out of Art. 22 — the human intervention\nmust be **meaningful**. With health data, Art. 22(4) adds that such decisions may only rest\non Art. 9 special-category data with **explicit consent** or a substantial-public-interest basis.\n\n## Concrete obligations\n- Establish a lawful **exception** (Art. 22(2)): necessary for a contract, authorised by\n  Union/Member-State law, or **explicit consent** — and for health data meet Art. 22(4).\n- Implement **safeguards** (Art. 22(3)): the right to obtain **human intervention**, to\n  **express a point of view**, and to **contest** the decision; design a genuine human review,\n  not a sign-off.\n- Provide **transparency** (Art. 13-15): inform the person that automated decision-making\n  exists and give **meaningful information about the logic** and the consequences.\n- Where the system is AI-driven, coordinate with AI Act human-oversight duties\n  ([[ai_act_high_risk]]) and run a DPIA ([[gdpr_dpia]]).\n\n## Checklist\n- [ ] Map which user-facing decisions are *solely* automated and *significant*.\n- [ ] Pick and document a valid Art. 22(2) exception (+ Art. 22(4) for health data).\n- [ ] Build a meaningful human-review path (not a rubber-stamp) plus contest/appeal flow.\n- [ ] Add Art. 13-15 notices describing the logic and significance.\n- [ ] Cross-check Swiss equivalent if you also serve CH users — see [[nlpd_automated_dpia]].\n\n## Examples (mHealth)\n- An app that **auto-refuses a teleconsultation** or auto-assigns an emergency triage level\n  with no clinician in the loop → Art. 22 decision: needs an exception + human-review safeguards.\n- A symptom checker that **scores cardiovascular risk** which an insurer then uses for pricing\n  → SCHUFA-style: the score is the significant decision; Art. 22 + explicit consent apply.\n- (Edge/negative) An app that flags a borderline reading and a **clinician genuinely reviews\n  and decides** each case → not \"solely\" automated; Art. 22 does not bite (but log the review).\n\n## HERA dimensions touched\n- **Automated decision-making** · **Human oversight** · **Transparency**\n- Cross-links: [[nlpd_automated_dpia]], [[gdpr_dpia]], [[ai_act_high_risk]], [[gdpr_art9]]\n\n## Official sources\n- EUR-Lex — GDPR Art. 22: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679\n- CJEU SCHUFA Holding (Scoring), C-634/21: https://curia.europa.eu/juris/liste.jsf?num=C-634/21\n", "gdpr_base": "# GDPR — baseline (legal basis & rights)\n\n## Why this concerns you (purpose)\nIf your mHealth app touches **any personal data** of people in the EU/EEA, the GDPR\nis your non-negotiable baseline — it applies regardless of where your company is\nestablished (Art. 3 extraterritorial reach). It forces you to name a **legal basis**\nfor every processing operation, to be transparent with users, to honour their rights,\nand to keep the data secure. For a health app this is the floor on top of which the\nhealth-specific rules ([[gdpr_art9]]) and the device rules stack. Getting the baseline\nwrong (no legal basis, no records, no DPA with your cloud) is the single most common\ncause of enforcement fines, and it applies even before you process a byte of health data.\n\n## When it is triggered (scope)\nTriggered as soon as **any** of the following hold:\n- you process **personal data** (anything identifying a natural person, incl. a device\n  ID, email, or pseudonymised user ID) of people **in the EU/EEA**;\n- you **target** the EU market (offer the app to EU users) or **monitor** their behaviour;\n- you act as a **controller** (you decide why/how) or as a **processor** (you process on\n  someone else's behalf).\n\nIt applies even to a free app, even with no monetisation, and even if your servers sit\noutside the EU. Switzerland-only apps fall under a **distinct** regime — see [[nlpd_base]].\n\n## Concrete obligations\n- **Legal basis (Art. 6):** identify and document one per purpose (consent, contract,\n  legitimate interest…). For health content you must *also* satisfy Art. 9 — see [[gdpr_art9]].\n- **Transparency (Art. 12-14):** a clear, layered privacy notice at the point of collection.\n- **Data-subject rights (Art. 15-22):** access, rectification, erasure, portability,\n  objection — with a workable process to answer within **one month**.\n- **Records of processing (Art. 30):** maintain a register of your processing activities.\n- **Security (Art. 32):** appropriate technical/organisational measures (encryption at\n  rest and in transit, access controls, pseudonymisation).\n- **Breach notification (Art. 33-34):** notify the supervisory authority within **72 hours**\n  of becoming aware; notify affected users if the breach is \"high risk\".\n- **DPA (Art. 28):** a written data-processing agreement with **every** processor — cloud\n  host, analytics vendor, third-party LLM API, crash reporting.\n- **DPO (Art. 37(1)(c)):** mandatory if your **core activity** is large-scale processing of\n  health data.\n\n## Checklist\n- [ ] Map each processing purpose to a documented Art. 6 legal basis (and Art. 9 condition).\n- [ ] Sign an Art. 28 DPA with every processor (cloud, analytics, LLM API, support tools).\n- [ ] Stand up a rights-request workflow that answers within one month.\n- [ ] Maintain an Art. 30 record of processing and an Art. 32 security baseline (encryption, access control).\n- [ ] Have a breach playbook that can notify the authority within 72 hours, and appoint a DPO if you process health data at scale.\n\n## Examples (mHealth)\n- A symptom-checker app collecting email + symptoms from EU users → GDPR applies fully;\n  needs a legal basis, privacy notice, DPA with its cloud host, and (because of symptoms)\n  an Art. 9 condition — see [[gdpr_art9]].\n- A meditation app that stores only an anonymous random device token with **no** way to\n  re-identify the user → still likely personal data via the identifier; baseline GDPR applies.\n- A truly **anonymous**, aggregated usage statistic that cannot be linked back to any\n  individual → out of GDPR scope (Recital 26), but the bar for \"anonymous\" is high and\n  rarely met by raw event logs.\n\n## HERA dimensions touched\n- **Data protection baseline** · **Vendor/processor management** · **User rights & transparency**\n- Cross-links: [[gdpr_art9]] (health = special category), [[gdpr_dpia]] (high-risk assessment), [[gdpr_transfer]] (data leaving the EEA), [[hds_certification]] (FR hosting), [[nlpd_base]] (the distinct Swiss regime)\n\n## Official sources\n- EUR-Lex — Regulation (EU) 2016/679 (GDPR), consolidated text: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679\n- EDPB — guidelines and recommendations: https://www.edpb.europa.eu/our-work-tools/general-guidance/guidelines-recommendations-best-practices_en\n", "gdpr_biometric": "# GDPR Art. 9 — biometrics (+ AI Act Art. 5)\n\n## Why this concerns you (purpose)\nIf your mHealth app processes **biometric data to uniquely identify a person** (face,\nvoice print, fingerprint, iris, gait, retina), that data is a **special category** under\nGDPR Art. 9(1): processing is prohibited unless one of the Art. 9(2) exceptions applies.\nOn top of GDPR, the **EU AI Act Art. 5** now flatly *bans* some biometric uses regardless\nof consent. So biometrics raise two independent gates: a **lawfulness gate** (Art. 9) and\na **prohibition gate** (AI Act). Getting consent does not save you if the use is prohibited.\n\n## When it is triggered (scope)\nTriggered when **either** of the following holds:\n- you process biometric data **for the purpose of uniquely identifying** a natural person\n  (Art. 9(1)) — e.g. face/voice login, biometric patient matching; note mere photos or\n  voice recordings are *not* Art. 9 data until processed through specific technical means\n  for identification;\n- you run an AI system that **infers emotions** or **categorises people by biometric data**\n  (AI Act Art. 5) — e.g. a mood/stress detector from facial or vocal cues.\n\nIt applies even to a small user base: scale affects the DPIA test, not the Art. 9 trigger.\n\n## Concrete obligations\n- Identify a valid Art. 9(2) basis — in consumer mHealth this is almost always\n  **explicit consent** (Art. 9(2)(a)): freely given, specific, informed, separate from\n  other consents, and as easy to withdraw as to give.\n- Run a **DPIA** (Art. 35): processing biometric data for identification is on DPA\n  mandatory-DPIA lists (e.g. CNIL) — see [[gdpr_dpia]].\n- Check the **AI Act Art. 5** prohibitions, in force since **2 Feb 2025**: emotion\n  recognition in the **workplace/education** is banned *except for medical or safety\n  reasons*; biometric categorisation to infer sensitive traits (race, sexual orientation,\n  political/religious belief) is banned. Penalties up to EUR 35M / 7% of turnover.\n- Minimise: prefer **on-device** matching and avoid retaining raw biometric templates;\n  offer a **non-biometric fallback** for authentication.\n\n## Checklist\n- [ ] Confirm whether your processing is for *unique identification* (Art. 9 trigger) or merely incidental.\n- [ ] Document explicit, separable, withdrawable consent (Art. 9(2)(a)) and a non-biometric alternative.\n- [ ] Screen the use against AI Act Art. 5 (emotion recognition / biometric categorisation bans).\n- [ ] Complete a DPIA before go-live (see [[gdpr_dpia]]).\n- [ ] Prefer on-device processing; define a retention/deletion rule for templates.\n\n## Examples (mHealth)\n- A dermatology app using **facial recognition** to match a returning patient to their\n  record → Art. 9 biometric identification: explicit consent + DPIA required.\n- A therapeutic VR app that **infers patient stress from facial expression** to adapt a\n  session → emotion recognition, but plausibly within the AI Act Art. 5 **medical-reasons\n  exception** (still: GDPR Art. 9 + DPIA, and document the medical justification).\n- (Edge/negative) A wellness app storing a **selfie avatar** purely for display, never run\n  through identification algorithms → *not* Art. 9 biometric data; ordinary Art. 6 applies.\n\n## HERA dimensions touched\n- **Sensitive-data lawfulness** · **AI prohibited practices** · **DPIA**\n- Cross-links: [[gdpr_art9]], [[gdpr_dpia]], [[ai_act_high_risk]], [[ai_act_transparency]]\n\n## Official sources\n- EUR-Lex — GDPR (Art. 9, Art. 35): https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679\n- EU AI Act — Art. 5 prohibited practices: https://artificialintelligenceact.eu/article/5/\n", "gdpr_children": "# GDPR Art. 8 — children\n\n## Why this concerns you (purpose)\nIf your mHealth app is offered **directly to children** and relies on **consent**, GDPR\nArt. 8 sets an age below which the child cannot consent alone: you need consent from a\n**holder of parental responsibility**. Children are deemed less aware of the risks, so the\nGDPR (Recital 38) requires *specific protection*. In a health context — where Art. 9\nsensitive data is also in play — the bar for clear information and verification is high.\n\n## When it is triggered (scope)\nTriggered when **all** of the following hold:\n- your service is an **information society service** (an app/online service) offered\n  **directly to a child**;\n- your **legal basis is consent** (Art. 6(1)(a) / Art. 9(2)(a)); and\n- the user is **below the applicable age threshold**.\n\nThe threshold is **16 by default**, but Member States may lower it to **no less than 13**:\nGermany, the Netherlands, Ireland = 16; **France = 15**; Spain = 14; Belgium = 13. You must\napply the threshold of the user's country. If your basis is *not* consent (e.g. a care contract), Art. 8 itself\ndoes not bite — but the child-protection principles still apply.\n\n## Concrete obligations\n- Determine the **applicable national age** for each market and gate accordingly.\n- Below the threshold, obtain and **verify** consent from the holder of parental\n  responsibility, making *reasonable efforts* given available technology (Art. 8(2)).\n- Provide **child-friendly transparency**: plain-language notices a minor can understand\n  (Recital 58); align with the ICO Age-Appropriate Design Code as best practice.\n- Apply **data minimisation and privacy-by-default**; avoid profiling/targeted ads to minors.\n- Note the exception: **preventive or counselling services offered directly to a child** do\n  not require parental authorisation (Recital 38), as they serve the child's best interests.\n\n## Checklist\n- [ ] Map your age threshold per target Member State (13-16) and add an age gate.\n- [ ] Build a verifiable parental-consent flow for under-threshold users.\n- [ ] Write child-friendly privacy information and a separate parent-facing notice.\n- [ ] Disable behavioural advertising and unnecessary profiling for minors by default.\n- [ ] Document whether the preventive/counselling exception applies to your service.\n\n## Examples (mHealth)\n- A teen **mental-wellness app** in France (threshold 15) relying on consent → needs\n  verified parental consent for users under 15.\n- A youth **sleep/step tracker** processing heart-rate data → Art. 8 *and* Art. 9 stack:\n  parental consent plus a DPIA-grade assessment of the sensitive data — see [[gdpr_dpia]].\n- (Edge/negative) A **confidential self-harm counselling chat** aimed directly at minors →\n  falls under the preventive/counselling exception: parental consent could defeat its\n  purpose, so it is not required, but child-friendly safeguarding still applies.\n\n## HERA dimensions touched\n- **Lawful basis (consent)** · **Vulnerable data subjects** · **Transparency / UX**\n- Cross-links: [[gdpr_art9]], [[gdpr_dpia]], [[data_monetization]], [[eprivacy_terminal]]\n\n## Official sources\n- EUR-Lex — GDPR Art. 8: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679\n- EU Commission — safeguards for children's data: https://commission.europa.eu/law/law-topic/data-protection/rules-business-and-organisations/legal-grounds-processing-data/are-there-any-specific-safeguards-data-about-children_en\n", "gdpr_dpia": "# GDPR Art. 35 — Data Protection Impact Assessment (DPIA)\n\n## Why this concerns you (purpose)\nA DPIA is a documented, *before-the-fact* assessment of the risks your processing poses to\npeople's rights and freedoms, plus the measures that mitigate them. Under GDPR Art. 35 it is\n**mandatory** whenever processing is \"likely to result in a high risk\" — and large-scale\nprocessing of health data almost always qualifies. For an mHealth product, the DPIA is the\nbackbone document that ties together your lawful basis, security, and accountability.\n\n## When it is triggered (scope)\nA DPIA is required when processing is likely to result in a high risk, in particular for the\nthree Art. 35(3) cases, including **large-scale processing of special-category (health) data**\nand **systematic large-scale monitoring**. To test \"high risk\", apply the **WP248 rev.01**\nnine criteria: meeting **two or more** raises a presumption that a DPIA is needed (evaluation/\nscoring, automated decisions with significant effect, systematic monitoring, sensitive data,\nlarge scale, matching/combining datasets, vulnerable subjects, innovative technology,\npreventing rights exercise). DPAs publish **mandatory-DPIA lists**: the **CNIL** list\n(Deliberation 2018-327, 11 Oct 2018) expressly includes health/medico-social patient-care\nsystems, health data warehouses/registries, and biometric identification of vulnerable persons.\n\n## Concrete obligations\n- Produce the DPIA **before** processing starts; it must contain the four Art. 35(7) elements:\n  systematic description, necessity & proportionality assessment, risk assessment, mitigation.\n- **Seek the DPO's advice** (Art. 35(2)) and, where appropriate, the **views of data subjects**.\n- If a **high residual risk** remains after mitigation, carry out **prior consultation** of\n  the supervisory authority under **Art. 36** before going live.\n- **Review/update** the DPIA when the processing changes; keep it as an accountability record.\n\n## Checklist\n- [ ] Screen against Art. 35(3) + WP248 rev.01 (2-criteria rule) and your DPA's mandatory list (e.g. CNIL).\n- [ ] Draft the four Art. 35(7) sections; involve the DPO and, if relevant, data subjects.\n- [ ] Identify and implement mitigations (encryption, minimisation, access controls, retention).\n- [ ] If high residual risk remains, file an Art. 36 prior consultation before launch.\n- [ ] Run the Swiss equivalent if you also serve CH users — see [[nlpd_automated_dpia]].\n\n## Examples (mHealth)\n- A chronic-disease app **monitoring 50,000 patients' vitals continuously** → large-scale\n  health data + systematic monitoring: two WP248 criteria → DPIA mandatory.\n- An AI symptom-triage feature combining health, location and behavioural data → sensitive\n  data + scoring + innovative tech: DPIA mandatory, likely Art. 36 consultation.\n- (Edge/negative) A solo physiotherapist's app holding **a few dozen local patient notes**,\n  no profiling → not \"large scale\"; a DPIA may not be strictly mandatory, but document the\n  reasoned screening decision anyway.\n\n## HERA dimensions touched\n- **Risk assessment & accountability** · **Sensitive-data processing** · **Supervisory liaison**\n- Cross-links: [[gdpr_art9]], [[nlpd_automated_dpia]], [[gdpr_biometric]], [[gdpr_automated]]\n\n## Official sources\n- EUR-Lex — GDPR Art. 35-36: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679\n- CNIL — list of processing requiring a DPIA: https://www.cnil.fr/fr/analyse-dimpact-relative-la-protection-des-donnees-publication-dune-liste-des-traitements-pour\n- WP248 rev.01 (Art. 29 WP DPIA guidelines): https://ec.europa.eu/newsroom/article29/items/611236\n", "gdpr_transfer": "# GDPR Chapter V — international transfers\n\n## Why this concerns you (purpose)\nIf your health data leaves the EEA — even just to a cloud sub-processor or a third-party AI\nAPI hosted abroad — GDPR **Chapter V** (Art. 44-49) governs the transfer. The rule: you may\nonly transfer if the destination ensures a level of protection **essentially equivalent** to\nthe GDPR. For sensitive health data this is one of the highest-scrutiny areas, and \"it's on\nAWS/Azure\" is not an answer by itself: you must identify the **transfer mechanism** and, after\n*Schrems II*, assess the destination country's laws.\n\n## When it is triggered (scope)\nTriggered whenever personal (health) data is **transferred to or accessed from a third country**\n(outside the EEA) or an international organisation — including:\n- storage/processing by a **non-EEA cloud** or sub-processor;\n- **remote support/admin** access from a third country;\n- calls to a **third-party AI/LLM API** hosted abroad.\n\nSwitzerland is a special case: the GDPR does not apply to a Swiss-only flow, and **Switzerland\nmaintains its own adequacy list** (Annex 1 of the Swiss Data Protection Ordinance, overseen by\nthe **FDPIC**), distinct from the EU's. The EU-Swiss flow itself benefits from mutual adequacy.\n\n## Concrete obligations\n- Identify a **valid transfer tool**: an **adequacy decision** (Art. 45 — e.g. Switzerland,\n  UK; US only via the Data Privacy Framework for certified importers), or **appropriate\n  safeguards** (Art. 46) such as the **2021 Standard Contractual Clauses** (Decision 2021/914),\n  or a narrow **Art. 49 derogation**.\n- Where you rely on SCCs, perform a **Transfer Impact Assessment (TIA)**: document that the\n  destination's laws/practices do not undermine the SCCs, and add **supplementary measures**\n  (encryption, pseudonymisation, access controls) where needed.\n- Map the **full data path including sub-processors**; flow down SCCs/obligations contractually.\n- For Swiss flows, use the **Swiss-adapted SCCs** (FADP references, FDPIC as authority) and\n  check the Swiss adequacy list separately from the EU's.\n\n## Checklist\n- [ ] Map every third-country transfer and access point, including sub-processors and AI APIs.\n- [ ] Assign a valid Chapter V mechanism to each (adequacy / 2021 SCCs / Art. 49 derogation).\n- [ ] Complete and document a TIA + supplementary measures where you rely on SCCs.\n- [ ] For Swiss data, use Swiss-adapted SCCs and check the FDPIC adequacy list.\n- [ ] Re-assess on sub-processor changes; coordinate with French hosting rules — see [[hds_certification]].\n\n## Examples (mHealth)\n- A patient app whose backend runs on a **US-region cloud** → adequacy only if the importer is\n  DPF-certified; otherwise 2021 SCCs + TIA + encryption.\n- An EU app calling a **non-EEA LLM API** to summarise clinical notes → that call is a transfer:\n  needs SCCs/TIA and an Art. 28 DPA, with strong supplementary measures for the health content.\n- (Edge/negative) Data hosted and processed **entirely within the EEA (or EU↔CH)** with no\n  third-country access → no Chapter V transfer; but verify *support/admin* never reaches in\n  from abroad (a common hidden transfer).\n\n## HERA dimensions touched\n- **Cross-border transfers** · **Vendor/sub-processor mapping** · **Data sovereignty**\n- Cross-links: [[hds_certification]], [[gdpr_dpia]], [[data_monetization]], [[gdpr_art9]]\n\n## Official sources\n- EUR-Lex — GDPR Chapter V (Art. 44-49): https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679\n- EU Commission — 2021 Standard Contractual Clauses (Decision 2021/914): https://commission.europa.eu/law/law-topic/data-protection/international-dimension-data-protection/new-standard-contractual-clauses-questions-and-answers-overview_en\n- CNIL — Transfer Impact Assessment practical guide (Jan 2025): https://www.cnil.fr/sites/default/files/2025-07/guide_tia.pdf\n", "hds_certification": "# HDS — Health Data Host certification (France)\n\n## Why this concerns you (purpose)\nIf you store the health data of French patients on a cloud or with any hosting\nprovider, French law requires that provider to hold the **HDS certification**\n(\"Hébergeur de Données de Santé\"). The obligation legally falls on **you, the data\ncontroller**: you must verify your host is certified — not just assume the cloud\nprovider \"is compliant\". A non-certified host = unlawful processing, even if you are\notherwise GDPR-compliant.\n\n## When it is triggered (scope)\nTriggered as soon as **all** of the following hold:\n- the data is **personal health data** (identifiable + relating to health);\n- it is **hosted on behalf of a third party** (i.e. you use an external host/cloud,\n  not purely on-premise self-hosting);\n- the data concerns **patients in France** (collected during prevention, diagnosis,\n  care or medico-social follow-up).\n\nIt applies **even if hosting is 100% inside the EU** — HDS is an extra French layer\n*on top of* GDPR, distinct from the international-transfer question (Q19).\n\n## Concrete obligations\n- Use a host certified for the **relevant activities** among the 6 HDS scopes\n  (physical sites, hardware infrastructure, application hosting platform, virtual\n  infrastructure, IS administration/operation, backup).\n- The v2 framework (order of 26 Apr. 2024, in force 16 May 2024) requires **physical\n  hosting within the EEA** and alignment with **ISO/IEC 27001:2022**.\n- Bring existing setups into compliance with v2 **by 16 May 2026** at the latest.\n- Keep the host's certificate on file (valid 3 years, annual surveillance audits).\n\n## Checklist\n- [ ] Confirm your host appears on the official ANS list of HDS-certified hosts.\n- [ ] Check the certificate covers your activities (esp. **application hosting** + **backup**).\n- [ ] Verify physical hosting is within the EEA (v2 requirement).\n- [ ] Reference HDS certification in your processor agreement (GDPR Art. 28 DPA).\n- [ ] Diarise the certificate expiry and the 16 May 2026 v2 deadline.\n\n## Examples (mHealth)\n- A teleconsultation app storing French patient records on AWS → AWS must be HDS-certified\n  for the hosting/backup activities used; the app publisher must verify it.\n- A wellness app with **no** identifiable French health data → out of HDS scope.\n- A SaMD whose backend runs on a French HDS-certified datacenter but whose analytics\n  DB is on a non-certified provider → the analytics DB breaches HDS if it holds health data.\n\n## HERA dimensions touched\n- **Data hosting & sovereignty** · **Vendor/processor management** · **French market access**\n- Cross-links: [[gdpr_base]] (Art. 28 DPA), [[gdpr_transfer]] (EEA hosting), [[telehealth_national]]\n\n## Official sources\n- Légifrance — PHC Art. L1111-8: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000049577902\n- ANS — list of HDS-certified hosts: https://esante.gouv.fr/offres-services/hds/liste-des-hebergeurs-certifies\n", "iso_82304": "# ISO/IEC 82304-2 — health software quality & safety\n\n## Why this concerns you (purpose)\nThis is the **fallback for apps that are *not* medical devices**. If your app has **no\nmedical purpose** — a wellness, fitness, lifestyle or general health-information app —\nit escapes the MDR/IVDR device regime (no [[mdr_class_iia]], no [[ivdr_class]]), but it\nis **not unregulated**. The IEC/ISO 82304 family lets you demonstrate **quality, safety\nand reliability** voluntarily, and earn a recognised **health-app quality label** that\nbuyers, insurers and app-store curators increasingly ask for. It is how you prove \"we are\nserious, even though we are not a medical device.\"\n\n## When it is triggered (scope)\nRelevant when your software is **health-related but does not meet the medical-device\ndefinition** — i.e. the decision tree concluded \"wellness\" (no medical purpose) or\n\"observational tracking\" (not SaMD). Two complementary standards apply:\n- **IEC 82304-1:2016** — general **product-safety** requirements for health software\n  placed on the market **without dedicated hardware** (covers the full lifecycle:\n  design, validation, installation, maintenance, decommissioning).\n- **ISO/TS 82304-2:2021** — **quality & reliability of health and wellness apps**,\n  defining a scored **health-app quality label** (a \"traffic-light\" style label) used by\n  manufacturers and independent app-assessment organisations.\n\nIf your app *does* have a medical purpose, it is **out of scope here** and falls under\nMDR/IVDR instead — re-check via the SaMD/Rule 11 path.\n\n## Concrete obligations\nThese are **voluntary** (no CE mark), but to claim conformity / obtain the label you:\n- Define the **intended use, intended users and use environment** of the health software.\n- Apply a **product-safety lifecycle** (IEC 82304-1) and software practices consistent\n  with the [[samd_standards]] family (risk thinking from ISO 14971, lifecycle hygiene\n  from IEC 62304) even though you are not a device.\n- Address **ISO/TS 82304-2 quality dimensions**: healthy & safe, easy to use, secure\n  data/privacy, robust/reliable, and effective (evidence of benefit).\n- Undergo (optionally) a **third-party assessment** to earn the quality label.\n- Remember the **horizontal laws still apply** regardless of device status: GDPR/Art. 9,\n  ePrivacy, AI Act transparency, accessibility — being \"non-medical\" does not exempt you.\n\n## Checklist\n- [ ] Confirm and document that the app has **no medical purpose** (so MDR/IVDR do not apply).\n- [ ] Define intended use, users and operating environment per IEC 82304-1.\n- [ ] Map your app against the ISO/TS 82304-2 quality dimensions and self-score.\n- [ ] Decide whether to pursue an independent quality-label assessment.\n- [ ] Verify horizontal obligations (privacy, security, accessibility) are still met.\n\n## Examples (mHealth)\n- A **step-counter / general fitness** app with motivational tips → wellness software;\n  ISO/TS 82304-2 label is the right quality signal, not MDR.\n- A **menstrual-cycle tracker** that only logs and predicts dates without any diagnostic\n  claim → observational tracking → 82304 family rather than [[mdr_class_iia]].\n- **Edge/negative:** a \"wellness\" mood app that **screens for depression and advises\n  clinical action** has crossed into a **medical purpose** → it is **no longer** in 82304\n  scope and must be qualified as SaMD ([[mdr_class_iia]] or higher).\n\n## HERA dimensions touched\n- **Non-device fallback / quality assurance** · **Voluntary EU quality label** · **Wellness vs medical boundary**\n- Cross-links: [[samd_standards]] · [[mdr_class_i]] · [[mdr_class_iia]] · [[ivdr_class]]\n\n## Official sources\n- ISO/TS 82304-2:2021 — health & wellness apps, quality & reliability (quality label): https://www.iso.org/standard/78182.html\n- IEC 82304-1:2016 — health software, general requirements for product safety: https://www.iso.org/standard/59543.html\n", "ivdr_class": "# IVDR — in-vitro diagnostic software (Regulation (EU) 2017/746)\n\n## Why this concerns you (purpose)\nIf your app provides information **by analysing data derived from a specimen taken from\nthe human body** (blood, urine, tissue, genetic/DNA data, biomarkers), it is **not** an\nMDR device — it is **IVD medical device software (IVD-MDSW)** under the IVDR, with its\n**own classification rules A-D**. This is a hard fork: the wrong regulation means the\nwrong classification, wrong conformity route and wrong clinical evidence. Many \"lab\nresult\" or \"genetic insight\" apps sit here, often surprised to learn that IVDR routes\n**most software to a Notified Body** (only Class A is self-certified).\n\n## When it is triggered (scope)\nTriggered when:\n- the software qualifies as a medical device **and** provides information based on the\n  **in-vitro examination of specimens** (IVDR Art. 2(2)) — per **MDCG 2019-11** this is\n  the MDR-vs-IVDR switch criterion;\n- it is then classified **A / B / C / D** under the **seven classification rules of IVDR\n  Annex VIII**, per **MDCG 2020-16 rev.4** (March 2025).\n\nIf the app interprets **other** clinical/physiological data (not from a specimen) → it is\nMDR SaMD instead → [[mdr_class_iia]] / [[mdr_class_iib]] / [[mdr_class_iii]]. If there is\nno medical purpose at all → [[iso_82304]].\n\n## Concrete obligations\n- **Classify under Annex VIII (rules 1-7):** Class **A** (low individual/public-health\n  risk, e.g. general lab tools), **B** (default/residual), **C** (e.g. detection of\n  sexually transmitted agents, genetic testing, cancer staging, companion diagnostics),\n  **D** (highest: e.g. blood-screening / transmissible agents threatening life).\n- **Conformity assessment by class:** Class **A is self-declared** (except A sterile);\n  Classes **B, C, D require a Notified Body**; **Class D** adds **EU reference\n  laboratory** batch verification and the most stringent scrutiny.\n- Apply the **GSPR (IVDR Annex I)** via the [[samd_standards]] (IEC 62304, ISO 14971,\n  IEC 62366-1, ISO 13485 QMS).\n- **Performance evaluation** (scientific validity, analytical & clinical performance) —\n  the IVDR analogue of the MDR clinical evaluation ([[clinical_eval_mdsw]]).\n- UDI + EUDAMED registration ([[udi_eudamed]]); PMS + performance follow-up\n  ([[pms_lifecycle]]).\n\n## Checklist\n- [ ] Confirm the input is genuinely a **specimen** → IVDR (not MDR).\n- [ ] Run the Annex VIII rules 1-7 with MDCG 2020-16 rev.4 to fix the A/B/C/D class.\n- [ ] If Class B/C/D, engage a Notified Body (Class D: factor in EU reference lab).\n- [ ] Build the performance evaluation (validity + analytical + clinical performance).\n- [ ] Register UDI + EUDAMED and set up PMS before placing on the market.\n\n## Examples (mHealth)\n- An app that **interprets a home blood-glucose or HbA1c v
